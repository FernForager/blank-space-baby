<title>Triviela Card Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/* Layout: the library as five lists (cards and the four pools they share), a sticky strip of views and search on top,
   bottom sheets for a card, a pool entry, an edit and a new card. The Board Room's palette and type, so the two rooms match. */
:root {
  --page: #F2EDE4; --card: #FBF8F3; --ink: #1E2A3B; --muted: #5C6675; --line: #E1D8C7; --cream: #F6F0E2;
  --green: #00843D; --green-soft: #E3F1E8; --green-card: #45BE76; --yellow: #F7C948; --red: #D52B1E;
  --warn: #9A5B08; --warn-bg: #FBEFD9; --bad: #B0262C; --bad-bg: #FBE3E3; --ok: #1E6B40; --ok-bg: #E3F1E8; --info: #3D5470; --info-bg: #E6ECF3;
  --shadow: 0 1px 0 #D9CFBC; --scrim: rgba(10,14,20,.45);
  --display: "Pixelify Sans", ui-rounded, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #161B22; --card: #1F2630; --ink: #E9EEF3; --muted: #A2AEBB; --line: #313B47; --cream: #26303B;
  --green: #45BE76; --green-soft: #1C3328; --green-card: #45BE76; --warn: #F2B65A; --warn-bg: #3A2C15; --bad: #FF8A8F; --bad-bg: #3D1F22; --ok: #7FD9A3; --ok-bg: #1C3328; --info: #A9C2DE; --info-bg: #222C38;
  --shadow: 0 1px 0 #0D1116; --scrim: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #161B22; --card: #1F2630; --ink: #E9EEF3; --muted: #A2AEBB; --line: #313B47; --cream: #26303B;
  --green: #45BE76; --green-soft: #1C3328; --green-card: #45BE76; --warn: #F2B65A; --warn-bg: #3A2C15; --bad: #FF8A8F; --bad-bg: #3D1F22; --ok: #7FD9A3; --ok-bg: #1C3328; --info: #A9C2DE; --info-bg: #222C38;
  --shadow: 0 1px 0 #0D1116; --scrim: rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 16px/1.4 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; }
h1 { font: 600 26px/1.1 var(--display); margin: 0; letter-spacing: .2px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--green); margin: 0 0 6px; }
.lede { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); padding: 12px 0 10px; display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font: 700 15px var(--body); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
input[type="search"], input[type="text"], input[type="url"], textarea, select { width: 100%; font: 16px/1.35 var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; }
select { padding-right: 28px; }
textarea { min-height: 76px; resize: vertical; }
.filters { display: grid; gap: 8px; margin: 2px 0 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font-size: 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chips button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.count { margin: 0 0 10px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.rc { width: 11px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); flex: none; display: inline-block; }
.rc.c1 { background: var(--green-card); } .rc.c2 { background: var(--yellow); } .rc.c3 { background: var(--red); }
ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; box-shadow: var(--shadow); min-width: 0; cursor: pointer; }
.row .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hook { font: 600 18px/1.15 var(--display); min-width: 0; overflow-wrap: anywhere; }
.tag { margin-left: auto; flex: none; font-size: 12px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.ex { margin: 0; overflow-wrap: anywhere; }
.ex mark { background: var(--green-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; font-weight: 700; }
.means { margin: 0; font-size: 14px; color: var(--muted); font-style: italic; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 7px; background: var(--info-bg); color: var(--info); }
.badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.mine, .badge.new { background: var(--green-soft); color: var(--green); }
.prow { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; cursor: pointer; min-width: 0; }
.prow .pt { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.prow .pn { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow .badges { grid-column: 1 / -1; }
.more { display: block; margin: 12px auto 0; }
.btn { font: 700 14px var(--body); border-radius: 9px; border: 1px solid var(--line); background: var(--cream); padding: 8px 12px; cursor: pointer; }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 0 0 12px; }
.panel summary { cursor: pointer; padding: 8px 0; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.panel summary .n { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.panel .why { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
.panel.inner { border: 0; border-top: 1px solid var(--line); border-radius: 0; margin: 0; padding: 0; background: none; }
.panel.inner summary { font-weight: 400; }
.countrow { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.countrow .count { margin: 0; flex: 1; min-width: 0; }
.countrow select { width: auto; padding: 5px 26px 5px 9px; font-size: 14px; }
.panel ul { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; }
.panel li button { background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; font-size: 15px; width: 100%; }
.panel li button:hover { color: var(--green); }
.cat { display: grid; gap: 6px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; } .bar .c1 { background: var(--green-card); } .bar .c2 { background: var(--yellow); } .bar .c3 { background: var(--red); }
.nums { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--page); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.foot .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.foot .state { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
/* the sheet: a card, an entry, an edit, over the list */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 90%; overflow: auto; overscroll-behavior: contain; background: var(--page); border-radius: 18px 18px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.sheet h2 { font: 600 21px/1.15 var(--display); margin: 0; overflow-wrap: anywhere; }
.sheet .sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.shead { display: flex; gap: 8px; align-items: center; }
.shead .btn { flex: none; }
.shead .sp { flex: 1; }
label.f { display: grid; gap: 4px; font: 700 14px var(--body); }
label.f small { font-weight: 400; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 9px 6px; font: 700 14px var(--body); cursor: pointer; display: flex; gap: 6px; align-items: center; justify-content: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.msgs { display: grid; gap: 4px; }
.msg { font-size: 14px; border-radius: 8px; padding: 6px 9px; background: var(--bad-bg); color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.warn { background: var(--warn-bg); color: var(--warn); } .msg.info { background: var(--info-bg); color: var(--info); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv a { color: var(--green); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices span { font-size: 14px; border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; background: var(--card); }
.choices span.right { border-color: var(--green); color: var(--green); font-weight: 700; }
/* a tile as the game draws it, and the card as it plays */
.tilebox { display: flex; gap: 14px; align-items: flex-start; }
.tile { position: relative; flex: none; width: 112px; height: 92px; border-radius: 10px; background: #F6F0E2; color: #1E2A3B; box-shadow: inset 0 -4px 0 rgba(30,42,59,.18), 0 0 0 1px rgba(30,42,59,.25);
  display: grid; align-content: center; justify-items: center; gap: 2px; padding: 8px 6px 10px; text-align: center; }
.tile .tt { font: 500 12px/1.1 var(--display); }
.tile .th { font: 600 16px/1.05 var(--display); overflow-wrap: anywhere; }
.tile .rc { position: absolute; top: 6px; right: 6px; width: 8px; height: 11px; }
.play { background: #10151C; color: #E8F6EC; border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.play p { margin: 0; font: 600 18px/1.35 var(--display); }
.play .blank { display: inline-block; min-width: 4.5em; border-bottom: 2px dashed #5CF09A; color: #5CF09A; }
.play .keys { display: grid; gap: 8px; }
.play .keys button { background: #F6F0E2; color: #1E2A3B; border: 0; border-radius: 10px; padding: 10px; font: 600 16px var(--display); cursor: pointer; text-align: center; }
.play .keys button.right { background: #45BE76; } .play .keys button.wrong { background: #FF5A5F; color: #fff; } .play .keys button.dim { opacity: .45; }
.play .pm { font: 500 14px var(--display); color: #BFD8C8; min-height: 1.2em; }
.empty { padding: 32px 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Triviela · the library</p>
    <h1>Card Room</h1>
    <p class="lede" id="lede">Every card, and the pools they share.</p>
  </header>
  <div class="top">
    <nav class="tabs" id="tabs" aria-label="Views">
      <button type="button" data-v="cards">Cards</button><button type="button" data-v="categories">Categories</button><button type="button" data-v="hook">Hooks</button><button type="button" data-v="answer">Answers</button><button type="button" data-v="wrong">Wrong answers</button>
    </nav>
    <input type="search" id="q" placeholder="Search" aria-label="Search">
  </div>
  <main id="main"><p class="empty">Loading the library…</p></main>
</div>
<div class="foot"><div class="in"><span class="state" id="save" aria-live="polite"></span><button class="btn go" id="newcard" type="button" hidden>New card</button></div></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div></div>

<script>
(function () {
  'use strict';
  // ---- small helpers ----
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => Number(n).toLocaleString('en-US');
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const day = iso => { const p = String(iso || '').slice(0, 10).split('-').map(Number); return p.length === 3 ? MON[p[1] - 1] + ' ' + p[2] : ''; };
  const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
  const COLOR = ['', 'Green', 'Yellow', 'Red'], EASE = ['', 'easy', 'harder', 'hardest'];
  const STATE = { a: 'In play', l: 'Locked', p: 'Waiting on the reviewers', f: 'Flagged', o: 'Out', n: 'Your new card' };
  const WHO = { soccer: 'the soccer expert', editor: 'the editor', facts: 'the fact checker' };
  // the library's own keys (tools/library.py): case and accents dropped, a score keeps its dash
  const letters = s => String(s == null ? '' : s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const key = s => letters(s).replace(/(\d)\s*[–-]\s*(?=\d)/g, '$1x').replace(/[^0-9a-z]+/g, '');
  const wtext = x => typeof x === 'string' ? x : (x && x.w) || '';
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // the build's own tests (build/build.py), so a check here means what the build will say
  const plain = s => ' ' + String(s).toLowerCase().replace(/[^0-9a-zÀ-ɏ]+/g, ' ').trim().split(' ').filter(Boolean).join(' ') + ' ';
  const words = s => String(s).toLowerCase().match(/[\p{L}\p{N}_’]+/gu) || [];
  const holds = (a, b) => b.length > 0 && a.some((_, i) => i <= a.length - b.length && b.every((x, j) => a[i + j] === x));
  const rxCount = (w, s) => (s.match(new RegExp('(^|[^A-Za-z0-9])(' + escRe(w) + ')(?![A-Za-z0-9])', 'gi')) || []).length;
  const shown = (w, ex, ans, hook) => (plain(ex).replace(plain(ans), ' ') + plain(hook || '')).includes(plain(w));
  const curly = s => s.replace(/(^|[\s(\[“—–-])'/g, '$1‘').replace(/'/g, '’').replace(/(^|[\s(\[—–-])"/g, '$1“').replace(/"/g, '”');
  const says = s => { const m = /\b(soccer|football)/i.exec(s); return m ? m[1].toLowerCase() : ''; };

  let D = null, C = [], CAT = {}, DECK = {}, DRAW = [], FIND = [], NOTES = [], SINCE = '', SPELL = { hook: {}, answer: {} };
  const QUIET = ['hook-answer', 'cross-cat'];   // findings that are fine as they are: shown on the card, never counted as a check
  let db = null, owner = false, live = false;
  const EDITS = {}, NEWS = {}, ASKS = {}, DONE = {};   // his saves, and the GM's log of what became of each (done)
  const S = {
    v: 'cards',
    cards: { q: '', cat: '', st: 'live', colors: [1, 2, 3], mine: false, checks: false, sort: 'deck', n: 40 },
    categories: { q: '' },
    hook: { q: '', sort: 'most', checks: false, fresh: false, n: 60 },
    answer: { q: '', sort: 'most', checks: false, fresh: false, n: 60 },
    wrong: { q: '', sort: 'most', checks: false, fresh: false, n: 60, mode: 'answers' }
  };
  const POOLNAME = { hook: ['hook', 'hooks'], answer: ['answer', 'answers'], wrong: ['wrong answer', 'wrong answers'] };
  const FLAG = {   // a pool entry's own findings (tools/library.py entry_flags): its badge, and whether it asks for a look
    case: ['Two capitals or accents', 'bad', 1], marks: ['Hyphen or space differs', 'warn', 1], near: ['Near twin', 'warn', 1], repeat: ['Repeats in one deck', 'warn', 1],
    kinds: ['In two kinds', 'warn', 1], lonely: ['Only one card', 'warn', 1], thin: ['Thin: under 4 answers', 'bad', 1], mixed: ['Mixes numbers and words', 'bad', 1],
    answer: ['Also an answer', '', 0], hook: ['Also a hook', '', 0], mine: ['Your own', 'mine', 0], own: ['Your own wrong answers only', 'mine', 0]
  };

  // ---- a card as it reads now: the library's card with Morg's saved edit on top ----
  function derive() {   // each save's fate: the newest record in the log for the wording he saved (its at), or still waiting
    const last = {};
    Object.keys(DONE).map(k => DONE[k]).sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(r => { last[r.col + '|' + r.id + '|' + r.for] = r; });
    [['edits', EDITS], ['new', NEWS], ['asks', ASKS]].forEach(([col, store]) => Object.keys(store).forEach(id => {
      const d = store[id], r = last[col + '|' + id + '|' + d.at];
      d.st = r ? r.st : col === 'asks' ? 'asked' : 'saved'; d.res = r ? r.res || '' : ''; d.card = r ? r.card || '' : '';
    }));
  }
  function inLibrary(c, e) {   // the library already reads as his edit (the GM republished it after applying)
    return Object.keys(e.f || {}).every(k => k === 'wr' ? JSON.stringify(c.wr && c.wr.length ? c.wr.map(wtext) : null) === JSON.stringify(e.f.wr || null) : base(c, k) === e.f[k]);
  }
  function ed(c) { const e = c && EDITS[c.id]; return e && e.st !== 'dropped' && !(e.st === 'applied' && inLibrary(c, e)) ? e : null; }
  function view(c) {
    if (c.s === 'n') return c;
    const e = ed(c), f = e ? e.f || {} : {};
    const v = Object.assign({}, c);
    if ('ex' in f) v.ex = f.ex; if ('w' in f) v.w = f.w; if ('hook' in f) v.h = f.hook; if ('means' in f) v.m = f.means; if ('d' in f) v.d = f.d; if ('cat' in f) v.c = f.cat;
    if ('wr' in f) { if (f.wr) v.wr = f.wr; else delete v.wr; }
    v.edited = !!e; v.edit = e; return v;
  }
  function news() {   // his own new cards, waiting to go into their decks
    return Object.keys(NEWS).map(id => NEWS[id]).filter(n => n.st !== 'dropped' && !(n.st === 'applied' && n.card && IDX[n.card] != null && C[IDX[n.card]].w === n.w)).sort((a, b) => (b.at || '').localeCompare(a.at || ''))
      .map(n => ({ id: 'new:' + n._id, doc: n._id, s: 'n', fate: n.st, res: n.res, card: n.card, c: n.cat, d: n.d, w: n.w, ex: n.ex, m: n.means, h: n.hook, k: n.k || 'own', wr: (n.wr || []).filter(Boolean), src: n.src, wm: n.wm, deck: n.deck, a: (n.at || '').slice(0, 10) }));
  }
  const deckOf = c => c.deck || c.id.split(':')[0];
  const tileOf = cat => (CAT[cat] || {}).tile || '';
  function marked(ex, w) {
    const m = w ? new RegExp('(^|[^A-Za-z0-9])(' + escRe(w) + ')(?![A-Za-z0-9])', 'i').exec(ex) : null;
    if (!m) return esc(ex);
    const i = m.index + m[1].length;
    return esc(ex.slice(0, i)) + '<mark>' + esc(ex.slice(i, i + w.length)) + '</mark>' + esc(ex.slice(i + w.length));
  }
  function wrongsOf(c) {   // what its other two buttons can show
    if (c.wr && c.wr.length) return { kind: 'mine', list: c.wr.map(wtext) };
    if (c.nr) return { kind: 'near', rule: c.nr };
    if (c.ix == null) { const kd = c.k && c.k !== 'own' && D.pools.kind.find(x => x.dk === c.deck && x.k === c.k); return kd ? { kind: 'pool', list: kd.a.filter(a => a !== c.w) } : { kind: 'none', list: [] }; }
    return { kind: 'pool', list: DRAW[c.ix].map(j => D.pools.wrong[j].t) };
  }

  // ---- drawing ----
  function lede() {
    const n = C.filter(c => c.s !== 'o').length, play = C.filter(c => c.s === 'a' || c.s === 'l').length, fresh = C.filter(c => c.s !== 'o' && c.a > SINCE).length;

    if (ref[0] === 'k') {
      const e = D.pools.kind[+ref.slice(1)];
      return sheet(el => { el.innerHTML = head(esc(DECK[e.dk].name + ' · ' + e.k), plural(e.a.length, 'answer') + ', ' + plural(e.c.length, 'card') + '. Every card of this kind can show the others’ answers as wrong ones') +
        '<div class="choices">' + e.a.map(a => '<span>' + esc(a) + '</span>').join('') + '</div>' + (e.x ? '<div class="badges">' + entryBadges(e, 'kind') + '</div>' : '') + cardList(e.c); });
    }
    const e = D.pools[name][+ref];
    sheet(el => {
      const mine = e.o || [];
      el.innerHTML = head(esc(e.t), (name === 'wrong' ? plural(e.c.length, 'card') + ' can draw it' + (mine.length ? ', ' + plural(mine.length, 'card') + ' of yours have it as your own' : '') : plural(e.c.length, 'card')) + '. In the library since ' + day(e.n)) +
        entryBadges(e, name) + (name === 'wrong' && mine.length ? '<b style="font-size:14px">Your own</b>' + cardList(mine) + '<b style="font-size:14px">From kinds</b>' : '') + cardList(e.c);
    });
  }
  $('newcard').addEventListener('click', () => sheet(el => editSheet(el, null)));
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S[h] && h !== S.v) { S.v = h; render(); } });

  // ---- start: the library, then Morg's saved edits, live ----
  try { const h = location.hash.slice(1), t = localStorage.getItem('cr-view'); if (S[h] && h !== 'v') S.v = h; else if (S[t] && t !== 'v') S.v = t; } catch (x) {}
  fetch('library.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    D = data; C = D.cards; D.cats.forEach(c => CAT[c.id] = c); D.decks.forEach(d => DECK[d.id] = d);
    const since = new Date(D.today + 'T12:00:00Z'); since.setUTCDate(since.getUTCDate() - D.lately); SINCE = since.toISOString().slice(0, 10);
    DRAW = C.map(() => []); D.pools.wrong.forEach((e, j) => e.c.forEach(i => DRAW[i].push(j)));
    FIND = C.map(() => []); NOTES = C.map(() => []);   // a card's findings: the ones that ask for a look, and the quiet ones (fine as they are)
    D.report.forEach((f, k) => f.items.forEach((x, n) => x.c.forEach(i => (QUIET.indexOf(f.code) >= 0 ? NOTES : FIND)[i].push([k, n]))));
    C.forEach((c, i) => { c.ix = i; IDX[c.id] = i; c.deck = c.id.split(':')[0];
      if (c.s === 'a' || c.s === 'l') { (SPELL.hook[key(c.h)] = SPELL.hook[key(c.h)] || new Set()).add(c.h); (SPELL.answer[key(c.w)] = SPELL.answer[key(c.w)] || new Set()).add(c.w); } });
    lede(); render(); status();
    return window.claude ? Promise.all([claude.use('db'), claude.use('user')]) : [null, null];
  }).then(([d, u]) => Promise.resolve(d && u ? u.isOwner() : !!d).then(o => [d, o], () => [d, true])).then(([d, o]) => {
    db = d; if (!db) { status(); return; }
    live = true; owner = !!o;   // only Morg writes here: the database's rules say so too
    $('newcard').hidden = !owner; status();
    const slow = setTimeout(() => { $('save').textContent = 'Your saved edits haven’t loaded yet. They will once the connection answers'; }, 10000);
    [['edits', EDITS], ['new', NEWS], ['asks', ASKS], ['done', DONE]].forEach(([col, store]) => db.collection(col).onSnapshot(snap => {
      clearTimeout(slow);
      if (snap.metadata.hasPendingWrites) return;   // our own change, already drawn
      Object.keys(store).forEach(k => delete store[k]);
      snap.docs.forEach(doc => { store[doc.id] = Object.assign({ _id: doc.id }, doc.data()); });
      refresh();
    }, () => { $('save').textContent = 'Your saved edits stopped updating. Reload the page'; }));
  }).catch(err => { $('main').innerHTML = '<p class="empty">The library didn’t load. Reload the page' + (err && err.message ? ' (' + esc(err.message) + ')' : '') + '.</p>'; });
})();
</script>
