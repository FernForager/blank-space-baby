<title>Triviela Card Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One card at a time, like the game's screen, with the three decisions as big keys below it.
   Colors come from the locked Triviela palette. Card text is in a plain face: the pixel font draws 5 like an S, and numbers get fact-checked here. */
:root {
  --page: #F2EDE4; --card: #FBF8F3; --ink: #1E2A3B; --muted: #5F6673; --line: rgba(30,42,59,.12);
  --celtic: #00843D; --irish: #45BE76; --flag: #B7791F; --cut: #C2413B; --screen: #07130C; --glow: #5CF09A; --screen-ink: #EAFBF0;
  --display: "Press Start 2P", ui-monospace, monospace;
  --pixel: "Pixelify Sans", ui-rounded, system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #161B22; --card: #1F2630; --ink: #EEF1F5; --muted: #A5ADB8; --line: rgba(255,255,255,.12);
  --celtic: #45BE76; --flag: #E0A94A; --cut: #F07167; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #161B22; --card: #1F2630; --ink: #EEF1F5; --muted: #A5ADB8; --line: rgba(255,255,255,.12);
  --celtic: #45BE76; --flag: #E0A94A; --cut: #F07167; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-size: 15px; letter-spacing: 1px; color: var(--celtic); }
.total { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
select { font: inherit; font-weight: 700; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; } .bar .ok { background: var(--irish); } .bar .fl { background: var(--flag); } .bar .ct { background: var(--cut); }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); }
.filter { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.screen { background: var(--screen); color: var(--screen-ink); border-radius: 14px; padding: 18px 18px 16px; box-shadow: 0 0 0 6px #0D0F0E;
  display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--display); font-size: 9px; color: var(--glow); opacity: .8; letter-spacing: .5px; }
.ex { margin: 0; font-family: var(--body); font-weight: 700; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.ex mark { background: none; color: var(--glow); text-shadow: 0 0 8px rgba(92,240,154,.6); }
.means { margin: 0; font-family: var(--body); font-size: 17px; color: #A9C9B4; }
.src { font-size: 13px; color: #A9C9B4; word-break: break-all; }
.src a { color: var(--glow); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(92,240,154,.4); color: var(--glow); }
.tag.cur { border-color: #E0A94A; color: #E0A94A; }
.state { font-size: 14px; font-weight: 700; min-height: 20px; }
.state.ok { color: var(--celtic); } .state.flag { color: var(--flag); } .state.cut { color: var(--cut); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keys button { font: inherit; font-weight: 700; font-size: 16px; padding: 14px 6px; border: 0; border-radius: 12px; color: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.keys button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.keys button:disabled { opacity: .45; cursor: default; transform: none; }
#ok { background: var(--celtic); } #flag { background: var(--flag); color: #1E2A3B; } #cut { background: var(--cut); }
textarea { font: inherit; width: 100%; box-sizing: border-box; min-height: 64px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nav button { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.done { text-align: center; padding: 30px 10px; font-family: var(--pixel); font-size: 20px; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--celtic); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <div class="top"><h1>TRIVIELA REVIEW</h1><span class="total" id="total"></span></div>
    <select id="deck" aria-label="Deck"></select>
    <div class="bar" id="bar"><i class="ok"></i><i class="fl"></i><i class="ct"></i></div>
    <div class="counts" id="counts"></div>
    <label class="filter"><input type="checkbox" id="todo" checked> Only cards I haven’t reviewed</label>
  </header>

  <section class="screen" id="screen" aria-live="polite"></section>
  <div class="state" id="state"></div>
  <div class="keys">
    <button id="ok" type="button">Approve</button>
    <button id="flag" type="button">Flag</button>
    <button id="cut" type="button">Cut</button>
  </div>
  <textarea id="note" placeholder="Note for Claude (optional). What’s wrong, or the fix you want."></textarea>
  <div class="nav">
    <button id="prev" type="button">← Back</button>
    <span class="pos" id="pos"></span>
    <button id="next" type="button">Skip →</button>
  </div>
  <p class="note" id="status">Connecting to saved decisions…</p>
</div>

<script>
(function () {
  var DECKS = __DATA__;
  var $ = function (id) { return document.getElementById(id); };
  var reviews = {};            // deck id -> { index: {s, note} }
  var di = 0, ci = 0, db = null;
  try { var last = JSON.parse(localStorage.getItem('tv-review-pos') || 'null'); if (last && DECKS[last.d]) { di = last.d; ci = last.c || 0; } } catch (e) {}

  DECKS.forEach(function (d, i) { reviews[d.id] = {}; var o = document.createElement('option'); o.value = i; $('deck').appendChild(o); });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function counts(d) { var r = reviews[d.id], c = { ok: 0, flag: 0, cut: 0 }; Object.keys(r).forEach(function (k) { if (c[r[k].s] !== undefined) c[r[k].s]++; }); c.left = d.cards.length - c.ok - c.flag - c.cut; return c; }
  function save() { try { localStorage.setItem('tv-review-pos', JSON.stringify({ d: di, c: ci })); } catch (e) {} }

  function header() {
    var all = 0, done = 0;
    DECKS.forEach(function (d, i) {
      var c = counts(d); all += d.cards.length; done += d.cards.length - c.left;
      $('deck').options[i].textContent = d.name + ' — ' + (c.left ? c.left + ' left' : 'done');
    });
    $('deck').value = di;
    $('total').textContent = done + ' of ' + all + ' reviewed';
    var d = DECKS[di], c = counts(d), n = d.cards.length, bar = $('bar').children;
    bar[0].style.width = (c.ok / n * 100) + '%'; bar[1].style.width = (c.flag / n * 100) + '%'; bar[2].style.width = (c.cut / n * 100) + '%';
    $('counts').innerHTML = '<span><b>' + c.ok + '</b> approved</span><span><b>' + c.flag + '</b> flagged</span><span><b>' + c.cut + '</b> cut</span><span><b>' + c.left + '</b> left</span>';
  }

  function card() {
    var d = DECKS[di], x = d.cards[ci], r = reviews[d.id][ci];
    if (!x) { $('screen').innerHTML = '<p class="done">Every card in this deck has a decision.</p>'; $('state').textContent = ''; $('pos').textContent = ''; return; }
    var w = x[0], ex = esc(x[1]), i = x[1].toLowerCase().indexOf(w.toLowerCase());
    if (i >= 0) ex = esc(x[1].slice(0, i)) + '<mark>' + esc(x[1].slice(i, i + w.length)) + '</mark>' + esc(x[1].slice(i + w.length));
    var host = (x[6].match(/^https?:\/\/([^\/]+)/) || [, x[6]])[1];
    $('screen').innerHTML = '<div class="meta"><span>' + esc(d.name.toUpperCase()) + '</span><span>' + (ci + 1) + '/' + d.cards.length + '</span></div>' +
      '<p class="ex">' + ex + '</p><p class="means">' + esc(x[2]) + '</p>' +
      '<div class="tags"><span class="tag">' + esc(x[3]) + '</span><span class="tag">' + ['', 'easy', 'medium', 'hard'][x[4]] + '</span>' + (x[5] ? '<span class="tag cur">can go stale</span>' : '') + '</div>' +
      '<div class="src">Source: <a href="' + esc(x[6]) + '" target="_blank" rel="noopener">' + esc(host) + '</a></div>';
    var st = $('state'); st.className = 'state' + (r ? ' ' + r.s : '');
    st.textContent = r ? ({ ok: 'Approved', flag: 'Flagged', cut: 'Cut' }[r.s] + (r.note ? ' · “' + r.note + '”' : '')) : '';
    $('note').value = r && r.note ? r.note : '';
    $('pos').textContent = 'Card ' + (ci + 1) + ' of ' + d.cards.length;
    save();
  }

  function nextIndex(from, dir) {
    var d = DECKS[di], n = d.cards.length, only = $('todo').checked;
    for (var k = 1; k <= n; k++) { var j = from + dir * k; if (j < 0 || j >= n) break; if (!only || !reviews[d.id][j]) return j; }
    if (only && dir > 0) { for (var j2 = 0; j2 < n; j2++) if (!reviews[d.id][j2]) return j2; return n; }
    return Math.max(0, Math.min(n - 1, from + dir));
  }
  function render() { header(); card(); }

  function decide(s) {
    var d = DECKS[di], x = d.cards[ci]; if (!x) return;
    var note = $('note').value.trim(), body = { s: s, note: note, w: x[0], ex: x[1] };
    reviews[d.id][ci] = body;                       // show it right away, the store confirms after
    var at = ci; ci = nextIndex(ci, 1); render();
    if (!db) { $('status').textContent = 'Not saved: open this page signed in to claude.ai so decisions are kept.'; return; }
    db.collection('r_' + d.id).doc(String(at)).set(body).then(function () { $('status').textContent = 'Saved.'; },
      function (e) { $('status').textContent = 'Couldn’t save that one (' + (e && e.code || 'error') + '). Try the decision again.'; delete reviews[d.id][at]; render(); });
  }

  $('ok').onclick = function () { decide('ok'); };
  $('flag').onclick = function () { decide('flag'); };
  $('cut').onclick = function () { decide('cut'); };
  $('next').onclick = function () { ci = nextIndex(ci, 1); render(); };
  $('prev').onclick = function () { ci = Math.max(0, ci - 1); render(); };
  $('deck').onchange = function () { di = +this.value; ci = 0; if ($('todo').checked) ci = nextIndex(-1, 1); render(); };
  $('todo').onchange = render;

  render();
  (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null)).then(function (d) {
    if (!d) { $('status').textContent = 'Read-only here: sign in to claude.ai to save decisions.'; ['ok', 'flag', 'cut'].forEach(function (id) { $(id).disabled = true; }); return; }
    db = d; $('status').textContent = 'Decisions save as you go.';
    DECKS.forEach(function (deck) {
      db.collection('r_' + deck.id).onSnapshot(function (snap) {
        var r = {}; snap.docs.forEach(function (doc) { var v = doc.data(); if (v) r[doc.id] = v; });
        reviews[deck.id] = r; render();
      }, function (e) { $('status').textContent = 'Couldn’t load saved decisions (' + (e && e.code || 'error') + ').'; });
    });
  });
})();
</script>
