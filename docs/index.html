<body style="margin:0">
<style>
/* The phone is the cabinet: marquee sign, CRT screen in a black bezel, push-buttons on a black control panel.
   The daily, as a shootout (Morg, Oct 19, 2026), nine cards since Oct 27, 2026: everyone gets the same 9 cards a day,
   3 green (easy), 3 yellow card (medium) and 3 red card (hard), and plays all 9. Tap any tile. A right answer lights a ring
   of its color's ball, and 9 right light all three balls whole: GOLAZO! The board is the grid: the three balls on the
   screen, the 9 tiles as keys on the panel, one card color per column. */
:root {
  --body: #F2EDE4; --body-dark: #00843D;   /* locked palette: warm white page, Celtic Green trim */
  --bezel: #0D0F0E; --screen: #07130C; --glow: #5CF09A; --text: #EAFBF0; --dim: #7FAF92; --gold: #F7C948;
  --btn: #F6F0E2; --btn-edge: #CBBFA4; --btn-ink: #1E2A3B;
  --ok: #45BE76; --ok-edge: #00843D; --no: #FF5A5F; --no-edge: #B02A35;
  --c1: #45BE76; --c1-edge: #00843D; --c2: #F7C948; --c2-edge: #B48A1C; --c3: #D52B1E; --c3-edge: #8C170F;   /* card colors: green (Morg, Oct 28, 2026: it was white, and green, yellow, red reads as easy to hard at a glance), yellow card, red card */
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body-font: "Pixelify Sans", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }   /* the cabinet stays put: no rubber-band bounce on iPhone (Morg, Oct 17, 2026) */
body { position: fixed; inset: 0; margin: 0; }
body { background: var(--body); color: var(--text); font-family: var(--body-font); font-weight: 600; -webkit-font-smoothing: antialiased; font-variant-ligatures: none; -webkit-user-select: none; user-select: none; }
button { -webkit-tap-highlight-color: transparent; font-variant-ligatures: none; }
.cab { max-width: 420px; height: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--body-dark) 0 6px, transparent 6px calc(100% - 6px), var(--body-dark) calc(100% - 6px)); }

/* marquee: the lit sign (flickers on when the game opens) */
.marquee { flex: none; position: relative; border-radius: 14px; padding: 14px 12px 15px; text-align: center; overflow: hidden;
  background: radial-gradient(120% 140% at 50% 0%, #1E3A2A 0%, #0B1710 70%); box-shadow: inset 0 0 0 3px #000, inset 0 0 18px rgba(92,240,154,.18), 0 3px 0 var(--body-dark); }
.marquee h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 22px; line-height: 1; letter-spacing: 3px; color: #fff; white-space: nowrap;
  text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 10px var(--glow), 0 0 20px rgba(92,240,154,.55); }
.cab.poweron .marquee h1 { animation: power .6s steps(6); }
/* the sign as a dot-matrix board (Morg, Oct 18, 2026): every dot lit at random, the brighter ones spell TRIVIELA */
.marquee.dm { height: 84px; padding: 0; box-sizing: border-box; }
/* the sign's subheading (Morg, Oct 19, 2026: what the game is, under the name, apart from the question that invites you to play):
   crisp arcade letters under the dots, solid and unglowing, at a size that lands on whole device pixels (10.67 px is 4 per font pixel at 3x).
   Since Oct 26, 2026 it sits centered under the whole sign, the name and the menu together (Morg), above the menu's dark backing so
   its last letters stay bright */
.marquee.dm .subhead { position: absolute; left: 0; right: 0; bottom: 9px; z-index: 2; margin: 0; color: #C9FFDD; text-shadow: none; pointer-events: none; }   /* no glow: a glow blurs pixel letters (Morg: clean and quiet) */
.marquee.dm canvas { position: absolute; inset: 7px 8px 25px; width: calc(100% - 16px); height: calc(100% - 32px); }
.tball { --bu: .6667px; display: inline-block; position: relative; width: calc(19 * var(--bu)); height: .875em; vertical-align: baseline; margin-right: .125em; }   /* the letter spacing a glyph would carry, so the gap after it matches the one before */   /* a ⚽ in a string: the pixel ball (Morg, Oct 26, 2026: it has to pop), 19 of its pixels across, each a whole number of screen dots */
.tball svg { position: absolute; left: 0; bottom: calc(.5625em - 9.5 * var(--bu)); width: calc(19 * var(--bu)); height: calc(19 * var(--bu)); }   /* centered on the capitals (their middle is 9/16 em up), drawn outside the line box so the line never grows */
@media (max-resolution: 2.49dppx) { .tball { --bu: .5px; } }   /* the 19-pixel ball (Oct 28, 2026): 2 screen dots a pixel at 3x, 1 at 2x */
.cab.poweron .marquee.dm canvas { animation: power .6s steps(6); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.marquee.dm .menu-b { right: 4px; z-index: 1; background: radial-gradient(closest-side, rgba(7,19,12,.95), rgba(7,19,12,.8) 70%, transparent); border-radius: 50%; }
.menu-b { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.menu-b[hidden] { display: none; }   /* the menu shows only when it has something in it: the demo's Start over (How to play went on Oct 28, 2026) */
.menu-b:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.menu-box { display: flex; flex-direction: column; gap: 12px; }
.menu-box .key { min-height: 50px; }
.menu-box .key[hidden] { display: none; }
.ask-pop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(5,10,7,.72); }
.ask-pop[hidden] { display: none; }
.ask-box { width: 100%; max-width: 320px; box-sizing: border-box; padding: 20px 16px 18px; border-radius: 18px; background: var(--bezel); box-shadow: inset 0 0 0 3px #000, 0 0 0 3px var(--body-dark), 0 10px 30px rgba(0,0,0,.5); text-align: center; }
.ask-box p { margin: 0 0 16px; color: var(--text); text-shadow: 0 0 8px rgba(92,240,154,.5); }
.ask-keys { display: flex; gap: 10px; }
.ask-keys .key { flex: 1; min-height: 50px; }
.ask-keys .key.yes { background: var(--ok); box-shadow: 0 5px 0 var(--ok-edge), 0 7px 10px rgba(0,0,0,.25); }
.restart { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .5; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.restart:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
@keyframes power { 0% { opacity: 0; } 17% { opacity: 1; } 34% { opacity: .15; } 51% { opacity: 1; } 68% { opacity: .4; } 100% { opacity: 1; } }

/* screen in its bezel */
.bezel { flex: 1 1 auto; min-height: 0; max-height: 520px; border-radius: 20px; padding: 10px; background: var(--bezel); box-shadow: 0 3px 0 var(--body-dark), inset 0 0 0 2px #222; }
.screen { position: relative; height: 100%; box-sizing: border-box; border-radius: 12px; overflow: hidden; padding: 14px 16px 16px;
  background: radial-gradient(130% 110% at 50% 40%, #0D2216 0%, var(--screen) 70%); display: flex; flex-direction: column; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 40px rgba(0,0,0,.7); }
.flick { animation: flick .28s steps(4); }
@keyframes flick { 0% { filter: brightness(2.2) contrast(.6); } 50% { filter: brightness(.5); } 100% { filter: none; } }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.cab[data-v="board"] #v-board, .cab[data-v="play"] #v-play, .cab[data-v="end"] #v-end { display: flex; }
.px { shape-rendering: crispEdges; flex: none; display: block; fill: currentColor; }
.nb { white-space: nowrap; }
.num { font-family: var(--pixel); font-weight: 400; font-size: calc(8em / 11); vertical-align: -.125em; letter-spacing: -.02em; }   /* a digit as tall as Pixelify's capitals (7 of its 11 pixels to Press Start 2P's 7 of 8), so 8/11 of the text around it. Press Start 2P draws an empty pixel row under every glyph, so the digit drops that row to sit on the baseline (brought back from beta-oct22, Oct 26, 2026) */
.score .num { font-size: 1em; vertical-align: baseline; letter-spacing: 0; }   /* the score is already in the arcade face */
.num.po { margin: 0 -.1875em 0 -.25em; }   /* the arcade face's ( sits at the right of its cell, so it's pulled in 2 of its pixels on the left and 1½ on the right, and ) half a pixel: the gaps then match the body font's word space and letter gaps (measured at 3×, Oct 26, 2026) */
.num.pc { margin-left: -.0625em; }

/* the ball: three rings of five lamp panels round its center pentagon (the hexagons round the center, the outer pentagons,
   the half-hexagons at the edge), one ring per card of its color since Oct 27, 2026 (Morg's lamp idea, Oct 19, 2026) */
.ball { position: relative; flex: none; aspect-ratio: 1; }
.bi { display: block; width: 100%; height: 100%; overflow: visible; }
.bi .body { fill: rgba(92,240,154,.05); }
.bi .glow { fill: url(#bglow); pointer-events: none; } .bi .shine { fill: url(#bshine); pointer-events: none; }   /* a hologram: the rim glows and a soft light sits top left */
.bi.mini .glow, .bi.mini .shine { display: none; }
.bi .sm { fill: none; stroke: #3E7A57; stroke-width: 2.2; stroke-linecap: round; }
.bi .pt { fill: url(#bdim); stroke: #3E7A57; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
.bi .pt.hx { fill: url(#bdim); fill-opacity: .45; }   /* an unlit hexagon is fainter than an unlit pentagon, so the empty ball still reads as a ball */
.bi .pt.on { fill: url(#bon); fill-opacity: 1; stroke: var(--text); filter: drop-shadow(0 0 1.5px rgba(92,240,154,.8)); }
.bi .pt.new { animation: bump .45s steps(3); }
/* the rings by color: a lit panel glows in its card's color, a missed one goes dark (Oct 26, 2026) */
.bi .pt.c1.on { fill: url(#bgrn); stroke: var(--glow); }   /* green lights in the screen's own green */
.bi .pt.c2.on { fill: url(#byel); stroke: #F7C948; filter: drop-shadow(0 0 1.5px rgba(247,201,72,.85)); }
.bi .pt.c3.on { fill: url(#bred); stroke: #E8473A; filter: drop-shadow(0 0 1.5px rgba(213,43,30,.95)); }
/* each ball in its own card color (Morg, Oct 26, 2026: the old green on a yellow ball didn't make sense): dim dots and seams in its color
   still to play, bright where right, near black where missed, and its rim glows in its color */
.bi.k1 .pt:not(.on) { fill: url(#bdim1); stroke: #3E7A57; } .bi.k1 .glow { fill: url(#bglow1); } .bi.k1 .body { fill: #5CF09A; fill-opacity: .04; }
.bi.k2 .pt:not(.on) { fill: url(#bdim2); stroke: #9A7E2C; } .bi.k2 .glow { fill: url(#bglow2); } .bi.k2 .body { fill: #F7C948; fill-opacity: .04; }
.bi.k3 .pt:not(.on) { fill: url(#bdim3); stroke: #9A3A30; } .bi.k3 .glow { fill: url(#bglow3); } .bi.k3 .body { fill: #E8473A; fill-opacity: .04; }
.bi.full { animation: ringflash .9s steps(3); }   /* a color all right: its ball flashes */
/* and its little moment (Morg, Oct 28, 2026: a cherry on top, with GOLAZO! still the peak): the ball spins once and pops, and a ring
   of dots bursts from it in its color. On a perfect day the last ball's moment plays first, then GOLAZO! */
.bi .spin { transform-box: view-box; transform-origin: 0 0; }   /* the view box starts at the drawing's 0 0, which is the ball's center */
.bi.full .spin { animation: spin .8s cubic-bezier(.25, .8, .3, 1); }
@keyframes spin { from { transform: rotate(-360deg); } }
.ball.fill { container-type: inline-size; animation: pop .5s steps(4); }
@keyframes pop { 40% { transform: scale(1.12); } }
.sparks { position: absolute; inset: 0; pointer-events: none; }
.sparks i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 1px; background: currentColor; box-shadow: 0 0 5px currentColor; opacity: 0; animation: spark .75s .1s steps(6) forwards; }
.sparks.k1 { color: #5CF09A; } .sparks.k2 { color: #F7C948; } .sparks.k3 { color: #E8473A; }
@keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(50cqw); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(.5); } }
@keyframes ringflash { 0%, 66% { filter: drop-shadow(0 0 4px #fff) brightness(1.5); } }
.balls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; width: 100%; column-gap: 5%; }
.pitch .balls .ball { width: 100%; max-width: 92cqh; justify-self: center; }
.balls .bi { display: block; width: 100%; height: auto; }
.ball.goal .bi .sm, .ball.goal .bi .pt { stroke: var(--text); }
.ball.goal .bi { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(92,240,154,.9)); }
.ball.goal { animation: bob .3s steps(2) 3; }
.bi.mini .body { fill: currentColor; } .bi.mini .sm { stroke: var(--mp, #07130C); stroke-width: 4; } .bi.mini .pt, .bi.mini .pt.on { fill: var(--mp, #07130C); stroke: var(--mp, #07130C); stroke-width: 3; filter: none; } .bi.mini .pt.hx { fill: none; stroke: var(--mp, #07130C); stroke-width: 3; }   /* the hexagons' outlines are the seams */
.share .bi.mini, .tile .bi.mini { color: #fff; --mp: #1E2A3B; } .share .bi.mini .body, .tile .bi.mini .body { stroke: #1E2A3B; stroke-width: 7; }
.egrid .bi.mini { color: var(--text); --mp: #07130C; }   /* on the CRT: a lit ball, its patches the screen's own black */
.bi.mark { flex: none; display: block; }
.goalfx { position: absolute; left: 0; top: 0; width: 100%; height: 82%; z-index: 2; pointer-events: none; filter: drop-shadow(0 0 2px rgba(92,240,154,.55)); animation: power .5s steps(5); }
.pitch.fxon .ball { opacity: 0; }
.pitch .shout { position: absolute; inset: 0; margin: auto; height: max-content; z-index: 3; color: #fff; pointer-events: none; text-shadow: 0 0 6px #fff, 0 0 14px var(--glow), 0 0 28px rgba(92,240,154,.7); animation: shout 2.2s ease-out forwards; }
.pitch.fxon .shout { inset: auto 0 2% 0; margin: 0 auto; opacity: 0; animation: shout 1.6s 1s ease-out forwards; }
@keyframes shout { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
.bv { display: block; overflow: visible; }
.bv polygon { fill: none; stroke: currentColor; stroke-width: 9; stroke-linejoin: round; }
.bv.on polygon { fill: currentColor; stroke-width: 4; }
.bv .rim { fill: none; stroke: currentColor; stroke-width: 4; opacity: .55; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes bump { 50% { transform: scale(1.5); } }

/* the board: the ball on the screen (the tiles are keys on the panel, below) */
#v-board { container-type: size; align-items: center; justify-content: center; }
.pitch { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.pitch .ball { width: 100%; width: min(100cqw, 100cqh); }   /* a plain width first, for a browser without container units (iOS 15, the audit). The ball fills the screen (Morg, Oct 17, 2026: the assembled ball is the payoff) */
/* the screen hugs its balls (Morg, Oct 28, 2026: the screen around the balls a bit smaller). Its natural height is the balls plus
   --hug above and below them (the balls are .3 of the screen's inner width, three columns with 5% gaps, and the cabinet, bezel and
   screen pad that width by 80 px in all), and any room to spare goes two thirds to the cards and a third to the screen */
.cab { --hug: 30px; }
.cab[data-v="board"] .bezel { flex: 1 1 calc(.3 * (min(100vw, 420px) - 80px) + 2 * var(--hug) + 20px); }
.cab[data-v="board"] .panel { flex: 2 1 auto; }
.cab[data-v="board"] #p-board.tiles { flex: 1 1 auto; grid-template-rows: repeat(3, minmax(0, 1fr)); }
/* below the cards, all day (Morg, Oct 28, 2026, in place of How to play): Pick a card in glowing screen letters, then the three card
   colors from easier to harder. They sit on the panel under the tiles, so the screen gives up their room and hugs the balls */
.hint { flex-direction: column; align-items: center; gap: 8px; padding-top: 14px; }
.cab[data-v="board"] #p-hint { display: flex; }
.pick { margin: 0; color: var(--glow); text-shadow: 0 0 6px rgba(92,240,154,.55); }   /* plain glowing letters (Morg, Oct 28, 2026: an arrow singled out the middle column) */
.pick .pk-t { display: block; }
.legend { margin: 0; display: flex; align-items: center; gap: 5px; color: var(--dim); }
.legend .rcard { width: 9px; height: 13px; }
.legend > span:first-child { margin-right: 3px; } .legend > span:last-child { margin-left: 3px; }
@media (max-height: 640px) { .hint { gap: 6px; padding-top: 11px; } .legend .rcard { width: 8px; height: 11px; } }

/* play */
.hud { display: flex; justify-content: space-between; align-items: flex-start; flex: none; height: 27px; position: relative; z-index: 3; }
.hud .lvl { display: flex; align-items: center; gap: 10px; }
.chip-card { width: 13px; height: 18px; border-radius: 2px; box-shadow: 0 0 6px rgba(255,255,255,.25); }
.chip-card.c1 { background: var(--c1); } .chip-card.c2 { background: var(--c2); } .chip-card.c3 { background: var(--c3); }
/* the shootout scoreboard (Oct 19, 2026): three rows of five, white on top, then yellow, then red, like the share.
   A lit dot is a right answer, a pixel ✕ a miss, a dim ring a card still to play. The card in play blinks in its row */
.sb { display: grid; grid-template-columns: repeat(3, 7px); grid-auto-rows: 7px; gap: 3px 4px; }
.sb i { display: block; width: 7px; height: 7px; color: #2F6B49; }
.sb i.ok { color: var(--glow); filter: drop-shadow(0 0 3px rgba(92,240,154,.9)); }
.sb i.no { color: var(--no); }
.sb i.now { color: var(--text); animation: blink 1.05s steps(1) infinite; }
.sb i.bump { animation: bump .35s steps(3); }
.sb svg { display: block; }
.face { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.sentence { margin: 0; text-shadow: 0 0 6px rgba(234,251,240,.25); }
 
.blank { display: inline-block; width: 2.9em; height: 4px; margin: 0 0.05em; vertical-align: -0.16em;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em); box-shadow: 0 0 6px rgba(92,240,154,.6); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
/* the answer, filled into the blank: glowing on a win, plain with a dashed underline on a miss */
.fill { color: var(--glow); text-shadow: 0 0 8px rgba(92,240,154,.7); }
.missed .fill { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.35); padding-bottom: 3px;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em) left bottom / 100% 3px no-repeat; }

/* the end of the day: the shootout grid and the score */
#v-end { justify-content: center; align-items: center; gap: 18px; gap: 6cqh; }   /* the px gap stands where cqh isn't understood (iOS 15) */
.egrid { display: grid; grid-template-columns: repeat(3, auto); gap: 9px 10px; align-items: center; }
.egrid .rc { width: 9px; height: 13px; border-radius: 1.5px; margin-right: 4px; }
.egrid .rc.c1 { background: var(--c1); } .egrid .rc.c2 { background: var(--c2); } .egrid .rc.c3 { background: var(--c3); }
.egrid .em { display: flex; align-items: center; justify-content: center; }
.egrid .em.ok { filter: drop-shadow(0 0 5px rgba(92,240,154,.75)); }
.egrid .em.no { color: var(--no); }
.golazo .egrid .em.ok { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(92,240,154,.9)); }
.score { margin: 0; color: #fff; text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 12px rgba(92,240,154,.6); }
.golazo .score { text-shadow: 0 0 6px #fff, 0 0 14px var(--glow), 0 0 28px rgba(92,240,154,.7); }
.result { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.word .run { display: block; margin-top: 4px; font-size: .8em; color: var(--text); }
.word { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 20px; line-height: 1.2; color: #fff; text-align: center;
  text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 12px rgba(92,240,154,.6); }
.means { margin: 0; color: #B8E6CA; }   /* the means line is the payoff, so it stays bright */
#v-end .ball { width: 62%; width: min(62%, 60cqh); margin: 0 auto; }
#v-end { container-type: size; }

/* the blinking go arrow, bottom right of the screen */
.go { position: absolute; right: 10px; bottom: 10px; height: 44px; padding: 0 6px 0 10px; gap: 8px; border: 0; background: none; color: var(--glow); cursor: pointer; z-index: 3; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); animation: blink 1.05s steps(1) infinite; }
.go.wait { display: none; }

/* the beta only (preview links): Morg's flag and lock keys, on a card he has answered and on the card that got him
   (Oct 16, 2026). A flag is yellow like a yellow card, a lock glows green */
.beta { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 2px; z-index: 3; }
.beta[hidden], .bk[hidden] { display: none; }
.bk { flex: none; width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .75; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.bk.on { opacity: 1; }
.bk.flag.on { color: var(--gold); filter: drop-shadow(0 0 5px rgba(247,201,72,.8)); }
.bk.lock.on { color: var(--text); filter: drop-shadow(0 0 5px rgba(92,240,154,.8)); }
.bmsg { color: var(--dim); margin-left: 6px; }

/* control panel */
.panel { flex: none; box-sizing: border-box; display: flex; margin-top: auto; border-radius: 18px; padding: 12px 12px 15px;
  background: linear-gradient(180deg, #1A1D1B 0%, #0D0F0E 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 0 0 2px #222, 0 3px 0 var(--body-dark); }
.pv { display: none; flex: 1; min-width: 0; }
.cab[data-v="end"] #p-end, .cab[data-v="play"] #choices { display: flex; }
.cab[data-v="board"] #p-board { display: grid; }
.key { font: inherit; color: var(--btn-ink); border: 0; border-radius: 14px; background: var(--btn); box-shadow: 0 5px 0 var(--btn-edge), 0 7px 10px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .06s, box-shadow .06s, background-color .15s, opacity .2s; }
.key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-edge), 0 2px 4px rgba(0,0,0,.25); }
.key:disabled { cursor: default; }

/* the tiles: easy, medium and hard, one column each */
#p-board.tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: 10px 8px; padding-bottom: 4px; }   /* three cards a color (Oct 27, 2026), so three rows */
.tile { position: relative; min-height: 80px; min-width: 0; padding: 4px 6px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
/* every tile is a cream key like the answer buttons. A small referee's card in the corner marks its color: green, yellow or red
   (Morg, Oct 26, 2026: easy too, to match the grid's header. Easy tiles had none from Oct 16, when bold tile colors took over
   the cabinet. Green since Oct 28, 2026, was white) */
.tile { background: var(--btn); color: var(--btn-ink); box-shadow: 0 4px 0 var(--btn-edge), 0 6px 8px rgba(0,0,0,.25); padding-left: 7px; padding-right: 7px; }   /* the shootout's taller tiles give the hook a little more width instead */
.tile.c1::after, .tile.c2::after, .tile.c3::after { content: ""; position: absolute; top: 5px; right: 6px; width: 10px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }   /* about twice the size since Oct 28, 2026 (Morg: they were tiny) */
.tile.c1::after { background: var(--c1); } .tile.c2::after { background: var(--c2); } .tile.c3::after { background: var(--c3); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
/* attract mode (Morg, Oct 19, 2026, back on Oct 28: his kids froze on the first screen, not knowing to pick a card): until the day's
   first tap, a wave of green light runs corner to corner across the tiles every 3.2 s, like an arcade cabinet's chase lights */
#p-board.attract .tile:not(:disabled) { animation: chase 3.2s infinite; animation-delay: calc(1.2s + var(--w) * 90ms); }
@keyframes chase { 0%, 14%, 100% { box-shadow: 0 4px 0 var(--btn-edge), 0 6px 8px rgba(0,0,0,.25); } 6% { box-shadow: 0 0 0 3px var(--glow), 0 0 16px rgba(92,240,154,.85), 0 4px 0 var(--btn-edge); } }
.tile.done, .tile.miss { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); background: rgba(246,240,226,.34); }
/* an answered tile keeps its result: the top ball in black and white for a right answer, a smooth red ✕ for a miss (shape, not just color) */
.tile.done::after, .tile.miss::after { opacity: .55; }
.tile .res { display: block; } .tile .bw { width: 34px; height: 34px; } .tile .bwx { width: 30px; height: 30px; }
.bw .h { fill: #fff; stroke: #1E2A3B; stroke-width: 2.2; stroke-linejoin: round; } .bw .p { fill: #1E2A3B; stroke: #1E2A3B; stroke-width: 2.2; stroke-linejoin: round; }
@media (max-height: 640px) { .tile .bw { width: 28px; height: 28px; } .tile .bwx { width: 25px; height: 25px; } }
.hk { display: block; width: 100%; overflow-wrap: normal; word-break: normal; hyphens: none; }

/* answer buttons */
.choices { flex-direction: column; gap: 10px; }
.choice { flex: none; min-height: 62px; padding: 6px 16px 6px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.choice .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.choice .def { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 0; opacity: 0; transition: max-height .2s, opacity .2s; }
.choice.right .def, .choice.wrong .def { max-height: 36px; opacity: .9; }
.choice .mark { width: 21px; flex: none; }

@keyframes nope { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }

/* end of the day: one-tap share, and the countdown to tomorrow's board */

.sgrid.se i { font-style: normal; display: block; text-align: center; }
.endrow { display: flex; align-items: center; justify-content: center; gap: 6px; }

.endrow .bk.flag.on { color: #B48A1C; filter: none; } .endrow .bk.lock.on { color: #45BE76; filter: none; }

/* the playtest demo (DEMO_DAYS in build.py): a finished board leads to the next with a blinking arrow, Start over goes back
   to #1, and #7 ends with a thank-you in the clock's place (Morg, Oct 17, 2026) */

.endrow .next { font: inherit; height: 40px; padding: 0 8px; border: 0; background: none; color: var(--glow); cursor: pointer; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 6px rgba(92,240,154,.6); }
.endrow .next svg { filter: drop-shadow(0 0 4px rgba(92,240,154,.8)); animation: blink 1.05s steps(1) infinite; }
.endrow .bk.again.on { color: var(--glow); opacity: 1; filter: drop-shadow(0 0 4px rgba(92,240,154,.8)); }
.clock.thanks { font-family: var(--body-font); font-size: 17px; letter-spacing: 0; }   /* the CRT's sentence face: one line, or two beside the beta's keys on the smallest phones */

ff who later comes back on is a return substitute","k":"game-who","hook":"taken off","d":1,"i":14,"h":"83ec6efbb9"},{"w":"starter","means":"One who plays from the first minute","ex":"A player in the lineup when the match begins is a starter","k":"game-who","hook":"lineup","d":1,"i":15,"h":"96d3e82c62"},{"w":"bench","means":"Also the seat where they wait","ex":"A team’s reserve players, waiting for a turn to play, are its bench","k":"game-who","hook":"reserve","d":1,"i":16,"h":"e0bbeaf99b"},{"w":"kicker","means":"The other keeper waits on the goal line","ex":"In a shoot-out, all players but the kicker and goalkeepers stay in the center circle","k":"game-who","hook":"circle","d":1,"i":17,"h":"9760b7ffae"},{"w":"coach","means":"Players can’t use phones or tablets","ex":"For tactics, a coach may use a smartwatch, but players may not","k":"game-who","hook":"smartwatch","d":1,"i":18,"h":"94b489e58a"},{"w":"team official","means":"So do the coach and other staff","ex":"A doctor who is listed with the players and subs counts as a team official","k":"game-who","hook":"doctor","d":1,"i":19,"h":"0bc54e71bc"},{"w":"referee","means":"Spare balls are the referee’s call too","ex":"During a match, the ball may be changed only with the referee’s permission","k":"game-who","hook":"ball","d":1,"i":20,"h":"9f6490d5f8"},{"w":"referee","means":"Any player on the field may do it","ex":"At a stoppage, a player may swap with the goalkeeper once the referee is told","k":"game-who","hook":"swap","d":1,"i":21,"h":"8e7fd55ed9"},{"w":"referee","means":"So is a ball wholly over a boundary line","ex":"Once the referee stops the game, the ball is out of play","k":"game-who","hook":"out of play","d":1,"i":22,"h":"5d2672815d"},{"w":"second half","means":"They swap at halftime","ex":"The two teams switch ends and attack the other goal in the second half","k":"game-time","hook":"switch ends","d":1,"i":23,"h":"a19e8379df"},{"w":"final whistle","means":"Shoot-out kicks come only afterward","ex":"The match ends at the final whistle, so a shoot-out isn’t part of it","k":"game-time","hook":"match ends","d":1,"i":24,"h":"e0a81cf279"},{"w":"coin toss","means":"The second toss winner picks who starts","ex":"In a shoot-out, the goal for every kick is chosen at the coin toss","k":"game-time","hook":"every kick","d":1,"i":25,"h":"7190f3ae69"},{"w":"additional time","means":"Subs and injuries do too","ex":"Goal celebrations make the additional time longer","k":"game-time","hook":"celebrations","d":1,"i":26,"h":"7a124e2110"},{"w":"halves","means":"So can the halves of extra time","ex":"In youth soccer, halves may be shorter than the usual 45 minutes","k":"game-time","hook":"youth soccer","d":1,"i":27,"h":"d76407a9b7"},{"w":"regulation","means":"Extra time and shoot-outs come after","ex":"Playing time set by the rules, not counting extra time, is called regulation","k":"game-time","hook":"playing time","d":1,"i":28,"h":"76eb2800d4"},{"w":"draw","means":"Scores like 1–1 and 2–2 are draws","ex":"When both teams score the same number of goals, the match is a draw","k":"game-result","hook":"same number","d":1,"i":29,"h":"06c616b5d4"},{"w":"tie","means":"Both mean the scores are level","ex":"Another word for a draw is a tie","k":"game-result","hook":"draw","d":1,"i":30,"h":"7329e26a42"},{"w":"forfeit","means":"Competition rules have the final say","ex":"A team at fault for having too few players to go on may lose by forfeit","k":"game-result","hook":"too few","d":1,"i":31,"h":"9db16d60fb"},{"w":"win","means":"The other side takes the loss","ex":"Scoring more goals than the other team means a win","k":"game-result","hook":"more goals","d":1,"i":32,"h":"9dfdddf507"},{"w":"shoot-out","means":"Yellow cards don’t carry over","ex":"A player shown a red card during the match can’t take part in the shoot-out","k":"game-result","hook":"red card","d":1,"i":33,"h":"e9c923ae76"},{"w":"shoot-out","means":"Then a lead after equal kicks wins it","ex":"A shoot-out still level after five kicks each goes on until one team leads","k":"game-result","hook":"five kicks","d":1,"i":34,"h":"e4f8a1f3fe"},{"w":"shoot-out","means":"Even before all five kicks are taken","ex":"A shoot-out ends early once one team can no longer catch up","k":"game-result","hook":"catch up","d":1,"i":35,"h":"d9629ced6b"},{"w":"challenge","means":"Tackles and charges are both kinds","ex":"Competing with an opponent for the ball is called a challenge","k":"game-play","hook":"opponent","d":1,"i":36,"h":"73c751fd04"},{"w":"save","means":"Not just goalkeepers make saves","ex":"A defender who stops a ball heading into the goal makes a save","k":"game-play","hook":"defender","d":1,"i":37,"h":"69f6332c6b"},{"w":"kick","means":"Just making contact is enough","ex":"Playing the ball with the foot or the ankle counts as a kick","k":"game-play","hook":"ankle","d":1,"i":38,"h":"10f9c04043"},{"w":"goal","means":"And under the crossbar too","ex":"It’s a goal only when the whole ball is over the line between the posts","k":"game-play","hook":"whole ball","d":1,"i":39,"h":"a171250cba"},{"w":"goal","means":"The referee rules it out","ex":"A goal won’t count if the scoring team committed an offense","k":"game-play","hook":"offense","d":1,"i":40,"h":"68c5b0af2c"},{"w":"goal","means":"Into the other net, it’s a goal kick","ex":"A goalkeeper who throws the ball into her own net by accident gives up a goal","k":"game-play","hook":"throws","d":1,"i":41,"h":"9e7bb52612"},{"w":"halfway line","means":"It joins the middles of both touchlines","ex":"The halfway line runs across midfield, splitting the field in two","k":"field-line","hook":"midfield","d":1,"i":42,"h":"b0a349a9be"},{"w":"goal line","means":"Their lines meet it at right angles","ex":"Both boxes at each end of the field are drawn out from the goal line","k":"field-line","hook":"boxes","d":1,"i":43,"h":"f6ca31f069"},{"w":"halfway line","means":"Standing on the line itself counts too","ex":"A player on their own side of the halfway line can’t be offside","k":"field-line","hook":"offside","d":1,"i":44,"h":"bcc90f528c"},{"w":"sideline","means":"It meets each goal line at a right angle","ex":"Another name for the touchline is the sideline","k":"field-line","hook":"touchline","d":1,"i":45,"h":"ba16e58ded"},{"w":"sidelines","means":"The lines themselves are also sidelines","ex":"Parents cheer from the sidelines, just outside the field’s long edges","k":"field-line","hook":"parents","d":1,"i":46,"h":"87d5be4d4f"},{"w":"pitch","means":"Touchlines and goal lines bound it","ex":"Another word for the field of play is the pitch","k":"field-area","hook":"field","d":1,"i":47,"h":"7e374a3e9f"},{"w":"goalmouth","means":"Written as one word","ex":"In soccer and hockey, the goalmouth is the area directly in front of the net","k":"field-area","hook":"net","d":1,"i":48,"h":"1c61347834"},{"w":"center mark","means":"It’s the midpoint of the halfway line","ex":"A full circle, 10 yards out, is drawn around the center mark","k":"field-area","hook":"full circle","d":1,"i":49,"h":"cf528a95ae"},{"w":"center circle","means":"At kickoff, opponents wait outside it","ex":"The halfway line cuts the center circle into two equal halves","k":"field-area","hook":"equal halves","d":1,"i":50,"h":"ba4345bb23"},{"w":"penalty arc","means":"Players wait outside it at penalty kicks","ex":"The penalty arc is the curved line bulging out from the top of the big box","k":"field-area","hook":"big box","d":1,"i":51,"h":"7cf4f32029"},{"w":"corner arc","means":"Its radius is just 1 yard","ex":"The corner arc is the quarter circle drawn around each flagpole","k":"field-area","hook":"flagpole","d":1,"i":52,"h":"0f81c0965c"},{"w":"penalty mark","means":"The penalty arc is 10 yards from it","ex":"The penalty mark is the spot in the big box straight out from the goal’s middle","k":"field-area","hook":"spot","d":1,"i":53,"h":"7cefc50930"},{"w":"technical area","means":"Lines on the ground mark its edges","ex":"A doctor may leave the technical area to check a hurt player, with the ref’s OK","k":"field-area","hook":"hurt player","d":1,"i":54,"h":"0e0745e003"},{"w":"technical area","means":"Stepping out now and then gets a warning","ex":"A coach who keeps stepping out of the technical area can be shown a yellow card","k":"field-area","hook":"stepping out","d":1,"i":55,"h":"af25e85849"},{"w":"penalty area","means":"Each line belongs to the area it marks","ex":"A foul right on the line of the big box counts as inside the penalty area","k":"field-area","hook":"on the line","d":1,"i":56,"h":"c808d525e5"},{"w":"goalpost","means":"Square, round or oval all work","ex":"Each goalpost must be the same shape as the crossbar","k":"field-goal","hook":"shape","d":1,"i":57,"h":"b200d55f21"},{"w":"net","means":"It’s an open-mesh fabric","ex":"Behind the keeper, the net wraps around the sides and back of the goal","k":"field-goal","hook":"keeper","d":1,"i":58,"h":"ad858ad010"},{"w":"net","means":"It must never get in the keeper’s way","ex":"The net may be fixed to the goal and the ground behind it","k":"field-goal","hook":"fixed","d":1,"i":59,"h":"76c28c6e7c"},{"w":"goalpost","means":"So must the crossbar","ex":"By rule, every goalpost on a soccer field must be white","k":"field-goal","hook":"white","d":1,"i":60,"h":"911cebb4d1"},{"w":"crossbar","means":"Play stops until it’s fixed or replaced","ex":"If the crossbar breaks, a rope can’t be strung between the posts instead","k":"field-goal","hook":"rope","d":1,"i":61,"h":"15505cb66a"},{"w":"crossbar","means":"The field’s size can change too","ex":"In youth soccer, the goal’s width and the height of its crossbar may change","k":"field-goal","hook":"youth","d":1,"i":62,"h":"d734b1d63b"},{"w":"corner flag","means":"Its top must not be pointed","ex":"A corner flag stands at each of the four points where the boundary lines meet","k":"field-goal","hook":"boundary","d":1,"i":63,"h":"7847266383"},{"w":"kickoff","means":"The other team kicked off the first half","ex":"The team that chose a goal at the coin toss takes the second-half kickoff","k":"restart-type","hook":"coin toss","d":1,"i":64,"h":"8235ff30aa"},{"w":"kickoff","means":"Into its own goal, it’s a corner kick","ex":"A team may score straight from the kickoff that starts each half","k":"restart-type","hook":"each half","d":1,"i":65,"h":"411090f27c"},{"w":"kickoff","means":"The kicker can’t touch it twice in a row","ex":"If a player starts in the wrong half, the kickoff is taken again","k":"restart-type","hook":"wrong half","d":1,"i":66,"h":"fe75dc4971"},{"w":"throw-in","means":"The thrower must face the field, too","ex":"Players take a throw-in with both hands","k":"restart-type","hook":"both hands","d":1,"i":67,"h":"7c8909e126"},{"w":"throw-in","means":"Starting above the head isn’t enough","ex":"At a throw-in, the ball must come from behind and over the head","k":"restart-type","hook":"head","d":1,"i":68,"h":"32d2903c61"},{"w":"throw-in","means":"Lifting a foot off the ground counts","ex":"A throw-in done the wrong way is retaken by the other team","k":"restart-type","hook":"wrong way","d":1,"i":69,"h":"e3a602adbb"},{"w":"throw-in","means":"If it lands outside first, throw again","ex":"A throw-in is in play as soon as the ball enters the field","k":"restart-type","hook":"in play","d":1,"i":70,"h":"55b41cf232"},{"w":"goal kick","means":"Not just the keeper: any teammate","ex":"A goal kick is always taken by the defending team","k":"restart-type","hook":"defending","d":1,"i":71,"h":"144cf3e240"},{"w":"corner kick","means":"The defense put it over their goal line","ex":"At a corner kick, the ball sits in the small arc and the flag can’t be moved","k":"restart-type","hook":"flag","d":1,"i":72,"h":"99d9445383"},{"w":"corner kick","means":"Only into the other team’s goal","ex":"A corner kick that curls straight in from the arc by the flag counts as a goal","k":"restart-type","hook":"curls","d":1,"i":73,"h":"0a63743dab"},{"w":"corner kick","means":"Kicked and clearly moving is enough","ex":"At a corner kick, the ball is in play once kicked, even if it never leaves the arc","k":"restart-type","hook":"never leaves","d":1,"i":74,"h":"1d933f92ae"},{"w":"penalty kick","means":"Everyone else waits behind the mark","ex":"At a penalty kick, only the keeper and the player taking it may be in the box","k":"restart-type","hook":"box","d":1,"i":75,"h":"0fa1d12283"},{"w":"penalty kick","means":"Stalling the kick isn’t allowed either","ex":"At a penalty kick, the keeper may not touch the posts or net to distract the shooter","k":"restart-type","hook":"shooter","d":1,"i":76,"h":"ce0b873c4a"},{"w":"penalty kick","means":"First a warning, then a yellow card","ex":"A penalty kick saved by a keeper who left the line early is taken again","k":"restart-type","hook":"saved","d":1,"i":77,"h":"3228105e43"},{"w":"penalty kick","means":"The defense gets an indirect free kick","ex":"A teammate who runs into the box early can’t score the rebound of a penalty kick","k":"restart-type","hook":"rebound","d":1,"i":78,"h":"dd0b7792a2"},{"w":"free kick","means":"In their own box, it’s a penalty kick","ex":"A coach who stops the ball in midfield is sent off, and the opponents get a free kick","k":"restart-type","hook":"sent off","d":1,"i":79,"h":"d597ac724e"},{"w":"free kick","means":"Where the foul happens is what counts","ex":"A foul just outside the box gives a free kick, even if the player lands inside","k":"restart-type","hook":"just outside","d":1,"i":80,"h":"ca0e893b41"},{"w":"free kick","means":"Unless the referee says to wait","ex":"A team may take a free kick quickly, before the other team sets a wall","k":"restart-type","hook":"quickly","d":1,"i":81,"h":"7fbd8e2118"},{"w":"dropped ball","means":"Touched in the air, it’s dropped again","ex":"At a dropped ball, the ball is in play once it touches the ground","k":"restart-type","hook":"ground","d":1,"i":82,"h":"2e8275a41e"},{"w":"dropped ball","means":"Fans and animals are outside agents","ex":"When a dog runs on and stops the ball, play restarts with a dropped ball","k":"restart-type","hook":"dog","d":1,"i":83,"h":"479f86f952"},{"w":"halfway line","means":"Opponents also keep 10 yards back","ex":"At kickoff, all but the kicker must be on their own side of the halfway line","k":"restart-place","hook":"kickoff","d":1,"i":84,"h":"02182c32a4"},{"w":"sideline","means":"Officially it’s called the touchline","ex":"At a throw-in, part of each foot must be on the sideline or the ground behind it","k":"restart-place","hook":"each foot","d":1,"i":85,"h":"a156ce0c78"},{"w":"corner arc","means":"Out over the goal line, off a defender","ex":"Attackers place the ball in the corner arc nearest to where it went out","k":"restart-place","hook":"attackers","d":1,"i":86,"h":"31f42338fb"},{"w":"goal line","means":"Not the usual 10 yards away","ex":"At a free kick close to goal, defenders may stand on the goal line between the posts","k":"restart-place","hook":"posts","d":1,"i":87,"h":"3491d09f8e"},{"w":"tripping","means":"It’s a direct free kick foul","ex":"Making an opponent stumble with a leg, or even trying to, is tripping","k":"fouls-act","hook":"leg","d":1,"i":88,"h":"7542488919"},{"w":"pushing","means":"Careless ones get a free kick, no card","ex":"Shoving an opponent in the back, even carelessly, is the foul called pushing","k":"fouls-act","hook":"back","d":1,"i":89,"h":"0f3c012cd3"},{"w":"charging","means":"The arm stays close to the body","ex":"Bumping an opponent shoulder to shoulder for the ball is called charging","k":"fouls-act","hook":"shoulder","d":1,"i":90,"h":"981db1d488"},{"w":"shielding","means":"Legal with the ball near and no holding","ex":"Keeping the body between an opponent and the ball is called shielding","k":"fouls-act","hook":"body","d":1,"i":91,"h":"31e4bd9909"},{"w":"tackling","means":"On the ground or in the air","ex":"Going for the ball with the foot to win it from an opponent is tackling","k":"fouls-act","hook":"foot","d":1,"i":92,"h":"4b5f7fefb4"},{"w":"tackling","means":"Once she lets go, it’s fair game","ex":"Once a keeper puts the ball down to play it, she’s open to tackling","k":"fouls-act","hook":"ball down","d":1,"i":93,"h":"cad933eeaf"},{"w":"kicking","means":"Too much force brings a red card","ex":"Swinging a leg at an opponent, even without contact, is the foul called kicking","k":"fouls-act","hook":"swinging","d":1,"i":94,"h":"b19f4f85c5"},{"w":"dangerous play","means":"No contact is needed for the call","ex":"Trying to play the ball in a way that could hurt someone is dangerous play","k":"fouls-act","hook":"hurt","d":1,"i":95,"h":"3adb5ecf72"},{"w":"dangerous play","means":"The danger to opponents is what counts","ex":"Bicycle and scissors kicks are legal, unless they count as dangerous play","k":"fouls-act","hook":"bicycle","d":1,"i":96,"h":"b9d066e98d"},{"w":"dangerous play","means":"It gives an indirect free kick","ex":"Even a player putting only herself at risk can be called for dangerous play","k":"fouls-act","hook":"herself","d":1,"i":97,"h":"a3b0da5530"},{"w":"handball","means":"It is if the arm moves toward the ball","ex":"The ball touching a player’s arm isn’t always handball","k":"fouls-act","hook":"arm","d":1,"i":98,"h":"97d517fa28"},{"w":"handball","means":"The arm starts below the armpit","ex":"A ball hitting arms that make the body unnaturally bigger can be called handball","k":"fouls-act","hook":"bigger","d":1,"i":99,"h":"c7e259fcaa"},{"w":"offside","means":"Past means nearer the goal line","ex":"Lurking past both the ball and the second-to-last opponent can be offside","k":"fouls-act","hook":"lurking","d":1,"i":100,"h":"2feafe8d2a"},{"w":"offside","means":"The first touch of the pass counts","ex":"Offside is judged at the moment a teammate plays or touches the ball","k":"fouls-act","hook":"moment","d":1,"i":101,"h":"4ff5f9132c"},{"w":"offside","means":"Offside still applies at free kicks","ex":"There’s no offside straight from a goal kick, a throw-in or a corner kick","k":"fouls-act","hook":"corner kick","d":1,"i":102,"h":"4979aec775"},{"w" ut telling the ref earns each player a yellow card","k":"fouls-call","hook":"swapping","d":1,"i":112,"h":"99c97e11cb"},{"w":"yellow card","means":"It also gives an indirect free kick","ex":"Yelling to distract an opponent during play can earn a player a yellow card","k":"fouls-call","hook":"yelling","d":1,"i":113,"h":"7d04597f21"},{"w":"yellow card","means":"Putting it back on later does too","ex":"A player who won’t remove a dangerous accessory earns a yellow card","k":"fouls-call","hook":"accessory","d":1,"i":114,"h":"9f436363b6"},{"w":"red card","means":"So her team plays a player short","ex":"During a match, a team can’t bring on a sub to replace a player who gets a red card","k":"fouls-call","hook":"replace","d":1,"i":115,"h":"b430edae52"},{"w":"red card","means":"Subs who get one must leave too","ex":"A player who gets a red card must leave the field and the bench area","k":"fouls-call","hook":"bench area","d":1,"i":116,"h":"3475fe850d"},{"w":"referee","means":"Their calls on facts of play are final","ex":"The referee runs the match, with full authority to enforce the rules","k":"people-official","hook":"rules","d":1,"i":117,"h":"d84a6314cb"},{"w":"referee","means":"Even the VAR can only advise them","ex":"The referee always makes the final decision, even after a video review","k":"people-official","hook":"decision","d":1,"i":118,"h":"bb36faf337"},{"w":"referee","means":"They decide if the weather allows play","ex":"If the floodlights are too dim, the referee may stop or call off the match","k":"people-official","hook":"floodlights","d":1,"i":119,"h":"9e21a259fa"},{"w":"referee","means":"Slight knocks wait till the ball’s out","ex":"The referee stops play for a serious injury but not for a slight one","k":"people-official","hook":"injury","d":1,"i":120,"h":"87f956acb2"},{"w":"referee","means":"They check that the bleeding has stopped","ex":"A player who is bleeding may come back only when the referee says so","k":"people-official","hook":"bleeding","d":1,"i":1 :"Working with assistants on replays","ex":"The VAR checks penalty calls from a video room that may be far from the stadium","k":"people-official","hook":"penalty","d":1,"i":131,"h":"043598a0ea"},{"w":"VAR","means":"No error found means a “silent check”","ex":"Coaches don’t need to ask for a review, since the VAR checks every goal","k":"people-official","hook":"coaches","d":1,"i":132,"h":"d6f0e6aa9a"},{"w":"VAR","means":"They also choose the replay speed","ex":"When the ref watches a replay, the VAR picks the best camera angle","k":"people-official","hook":"camera angle","d":1,"i":133,"h":"06d4489d07"},{"w":"VAR","means":"Their room is for approved people only","ex":"Any player who walks into the VAR’s video room gets a red card","k":"people-official","hook":"red card","d":1,"i":134,"h":"8f1414ced9"},{"w":"VAR","means":"The VAR checks big calls on its own","ex":"A player who keeps making the TV signal to ask for the VAR gets a yellow card","k":"people-official","hook":"TV signal","d":1,"i":135,"h":"a80e3555e4"},{"w":"VAR","means":"The referee may not give “no decision”","ex":"The ref must make a call without waiting for the VAR’s replay","k":"people-official","hook":"call","d":1,"i":136,"h":"9bd6399263"},{"w":"whistle","means":"Not needed to restart a throw-in","ex":"The referee blows the whistle to start each half and to restart after a goal","k":"people-gear","hook":"restart","d":1,"i":137,"h":"018c7063e4"},{"w":"whistle","means":"Kick early: a retake and a yellow card","ex":"At some free kicks, the referee tells the kicker to wait for the whistle","k":"people-gear","hook":"kicker","d":1,"i":138,"h":"5d366736b6"},{"w":"watch","means":"A must-have, like the whistle","ex":"As the timekeeper, the referee keeps track of time on their watch","k":"people-gear","hook":"timekeeper","d":1,"i":139,"h":"6ca5ff04ac"},{"w":"notebook","means":"Or another way to keep records","ex":"The referee writes down goals and cards in their notebook","k":"people-gear","hook":"cards","d":1, n passed instead","k":"move","hook":"pretending","d":2,"i":9,"h":"e77fe5edc4"},{"w":"chip","means":"Shot lofted over a player","ex":"The keeper came out too far, so the striker hit a chip over her head","k":"move","hook":"keeper","d":2,"i":10,"h":"2409a07d09"},{"w":"one-two","means":"Quick pass and instant return","ex":"The winger played a one-two, passing and getting it right back","k":"move","hook":"passing","d":2,"i":11,"h":"7faff9c094"},{"w":"Panenka","means":"Gently chipped penalty","ex":"The captain took the penalty with a soft Panenka down the middle","k":"move","hook":"penalty","d":2,"i":12,"h":"96c6d1a7f5"},{"w":"keepy-uppy","means":"Keeping the ball off the ground","ex":"Grandpa’s keepy-uppy in the yard ended when the ball hit the window","k":"move","hook":"Grandpa","d":2,"i":13,"h":"31dd3433a7"},{"w":"penalty kick","means":"Shot from 12 yards after a foul","ex":"The ref pointed to the spot 12 yards from goal and gave a penalty kick","k":"rules","hook":"12 yards","d":1,"i":14,"h":"2d96fba985"},{"w":"corner kick","means":"Kick from a corner of the field","ex":"The defender knocked it out behind her own goal, so it’s a corner kick","k":"rules","hook":"defender","d":1,"i":15,"h":"d12983fc88"},{"w":"free kick","means":"Unchallenged kick after a foul","ex":"The ref blew for a foul at midfield and gave the team a free kick","k":"rules","hook":"foul","d":1,"i":16,"h":"7d1c586b57"},{"w":"red card","means":"Card that sends a player off","ex":"After her second yellow, the defender got a red card and had to leave","k":"rules","hook":"had to leave","d":1,"i":17,"h":"bac8e83d2e"},{"w":"yellow card","means":"A caution, not a send-off","ex":"The ref showed the captain a yellow card as an official warning","k":"rules","hook":"warning","d":1,"i":18,"h":"c2d67ed152"},{"w":"offside","means":"Illegally ahead of the ball","ex":"The goal was waved off because the striker was offside","k":"adjective","hook":"waved off","d":1,"i":19,"h":"d7647fce54"},{"w":"handball","means":"Ille     css.textContent = '.tx-bar{position:fixed;left:8px;right:8px;top:max(6px,env(safe-area-inset-top,0px));z-index:99;display:flex;gap:6px;align-items:center;font:600 13px/1.2 system-ui,sans-serif;color:#fff;pointer-events:none}' +
      '.tx-bar button{pointer-events:auto;font:inherit;border:0;border-radius:999px;padding:8px 12px;background:#2B2F45;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}' +
      '.tx-bar .tx-on{background:#E040A0}.tx-bar .tx-n{margin-left:auto}' +
      '.tedit [data-t],.tedit [data-tid]{outline:1.5px dashed #E040A0;outline-offset:1px;cursor:text}' +
      '.tx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;max-height:78%;overflow:auto;background:#1B1E2E;color:#EEF;font:15px/1.35 system-ui,sans-serif;padding:14px 14px max(16px,env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5)}' +
      '.tx-sheet.tx-top{top:0;bottom:auto;border-radius:0 0 16px 16px;padding-top:max(14px,env(safe-area-inset-top,0px))}' +
      '.tx-sheet h3{margin:0 0 2px;font-size:13px;font-weight:600;color:#B9BCE0}.tx-sheet .tx-note{margin:0 0 10px;color:#CDD}' +
      '.tx-sheet textarea{width:100%;box-sizing:border-box;min-height:70px;font:17px/1.35 system-ui,sans-serif;padding:10px;border-radius:10px;border:0;background:#fff;color:#111}' +
      '.tx-sheet .tx-was{margin:8px 0 0;color:#99A;font-size:13px}.tx-sheet .tx-fit{margin:8px 0 0;font-weight:600}.tx-sheet .tx-fit.ok{color:#7CE3A6}.tx-sheet .tx-fit.no{color:#FF8A8F}' +
      '.tx-sheet .tx-keys{display:flex;gap:8px;margin-top:12px}.tx-sheet .tx-keys button{flex:1;font:600 15px system-ui,sans-serif;border:0;border-radius:10px;padding:12px;background:#33385A;color:#fff}.tx-sheet .tx-keys .tx-go{background:#45BE76;color:#0B1F12}' +
      '.tx-list button{display:block;width:100%;text-align:left;font:14px/1.3 system-ui,sans-serif;background:none;color:#EEF;border:0;border-bottom:1px solid #2E3350;padding:9px 2px}.tx-list b{display:block;font-size:12px;color:#B9BCE0;font-weight:600}.tx-list .tx-ed b::after{content:" · changed";color:#E040A0}';
    document.head.appendChild(css);
    var bar = document.createElement('div'); bar.className = 'tx-bar';
    bar.innerHTML = '<button type="button" id="tx-mode">Tap to edit</button><button type="button" id="tx-all">All text</button><button type="button" class="tx-n" id="tx-send"></button>';
    document.body.appendChild(bar);
    var sheet = document.createElement('div'); sheet.className = 'tx-sheet'; sheet.hidden = true; document.body.appendChild(sheet);
    function count() { var n = Object.keys(edits).length; $('tx-send').textContent = n ? 'Send ' + n + (n === 1 ? ' change' : ' changes') : 'No changes'; }
    function keep() { store.set('bsb-text-edits', edits); }
    $('tx-mode').addEventListener('click', function () { on = !on; this.classList.toggle('tx-on', on); this.textContent = on ? 'Editing: tap text' : 'Tap to edit'; document.body.classList.toggle('tedit', on); if (!on) close(); });
    document.addEventListener('click', function (e) {   // in edit mode a tap on text edits it, and never plays the game
      if (!on || bar.contains(e.target) || sheet.contains(e.target)) return;
      var el = e.target.closest('[data-t],[data-tid],[data-t-label]'); if (!el) return;
      e.preventDefault(); e.stopPropagation(); edit(el.dataset.t || el.dataset.tid || el.dataset.tLabel, el);
    }, true);
    function slotOf(el) { var hit = null; Object.keys(SLOTS).forEach(function (k) { if (el && (el.matches(SLOTS[k].sel) || el.closest(SLOTS[k].sel))) hit = k; }); return hit; }
    function fits(el, slot) {   // the text check, in the page: lines against the slot's limit, and nothing past its box
      if (!el || !el.getClientRects().length) return null;
      var box = (el.closest(SLOTS[slot] ? SLOTS[slot].sel : '*') || el), r = document.createRange(); r.selectNodeContents(el);
      var rects = [].filter.call(r.getClientRects(), function (q) { return q.width > .5; }), mids = [], b = box.getBoundingClientRect(), fs = parseFloat(getComputedStyle(el).fontSize);
      rects.forEach(function (q) { var m = (q.top + q.bottom) / 2; if (!mids.some(function (x) { return Math.abs(x - m) < fs * .45; })) mids.push(m); });
      var over = Math.max(0, b.left - Math.min.apply(null, rects.map(function (q) { return q.left; })), Math.max.apply(null, rects.map(function (q) { return q.right; })) - b.right, box.scrollWidth - box.clientWidth);
      var max = SLOTS[slot] && SLOTS[slot].lines;
      if (over > 1) return [false, 'Too wide by ' + Math.round(over) + ' px'];
      if (max && mids.length > max) return [false, mids.length + ' lines, this spot allows ' + max];
      return [true, 'Fits' + (max ? ' (' + mids.length + ' of ' + max + (max === 1 ? ' line)' : ' lines)') : '')];
    }
    function edit(id, el) {
      if (!(id in TEXT)) return;
      cur = { id: id, el: el }; var m = META[id] || {}, slot = m.slot || slotOf(el), where = SLOTS[slot] ? SLOTS[slot].where : '';
      sheet.innerHTML = '<h3>' + esc(id) + (where ? ' · ' + esc(where) : '') + '</h3><p class="tx-note">' + esc(m.note || '') + (m.ph ? '<br>Blanks the game fills in: ' + esc(m.ph) : '') + '</p>' +
        '<textarea id="tx-ta" rows="3" spellcheck="true"></textarea><p class="tx-fit" id="tx-fit"></p><p class="tx-was" id="tx-was"></p>' +
        '<div class="tx-keys"><button type="button" id="tx-undo">Back to the original</button><button type="button" class="tx-go" id="tx-done">Done</button></div>';
      sheet.hidden = false;
      var low = el && el.getBoundingClientRect().top > innerHeight * .45; sheet.classList.toggle('tx-top', !!low);   // the sheet never covers the text it edits
      var ta = $('tx-ta'); ta.value = TEXT[id];
      function upd() {
        var v = ta.value.replace(/\n/g, ' ').replace(/(^|[\s(“])'/g, '$1‘').replace(/'/g, '’').replace(/(^|[\s(])"/g, '$1“').replace(/"/g, '”');   // curly quotes, as the house style has them
        if (v !== ta.value) { var at = ta.selectionStart; ta.value = v; ta.selectionStart = ta.selectionEnd = at; }
        TEXT[id] = v; if (v === BASE[id]) delete edits[id]; else edits[id] = v; keep(); refresh();
        var live = el && document.contains(el) ? el : document.querySelector('[data-t="' + id + '"],[data-tid="' + id + '"]'), f = fits(live, slot);
        var need = BASE[id].match(/\{\w+\}/g) || [], has = v.match(/\{\w+\}/g) || [];
        var lost = need.filter(function (h) { return has.indexOf(h) < 0; }), odd = has.filter(function (h) { return need.indexOf(h) < 0; });
        var warn = (v.indexOf(';') >= 0 ? ' · No semicolons (house style)' : '') + (!v.trim() ? ' · Empty' : '') +
          (lost.length ? ' · Keep the blank ' + lost.join(' ') : '') + (odd.length ? ' · The game can’t fill ' + odd.join(' ') : '');
        $('tx-fit').className = 'tx-fit ' + (f && f[0] && !warn ? 'ok' : f || warn ? 'no' : '');
        $('tx-fit').textContent = (f ? f[1] : 'Not on this screen, so no fit check here') + warn;
        $('tx-was').textContent = v === BASE[id] ? '' : 'Was: ' + BASE[id];
      }
      ta.addEventListener('input', upd); upd();
      $('tx-undo').addEventListener('click', function () { ta.value = BASE[id]; upd(); });
      $('tx-done').addEventListener('click', close);
    }
    function close() { sheet.hidden = true; cur = null; }
    $('tx-all').addEventListener('click', function () {   // every string, including the spoken ones and the share text that no screen shows
      sheet.innerHTML = '<h3>All text · ' + Object.keys(TEXT).length + ' strings, tap one to change it</h3><div class="tx-list">' + Object.keys(TEXT).map(function (k) {
        return '<button type="button" data-k="' + esc(k) + '"' + (k in edits ? ' class="tx-ed"' : '') + '><b>' + esc(k) + '</b>' + esc(TEXT[k]) + '</button>'; }).join('') +
        '</div><div class="tx-keys"><button type="button" class="tx-go" id="tx-done">Done</button></div>';
      sheet.hidden = false; sheet.classList.remove('tx-top');
      [].forEach.call(sheet.querySelectorAll('[data-k]'), function (b) { b.addEventListener('click', function () { edit(b.dataset.k, null); }); });
      $('tx-done').addEventListener('click', close);
    });
    $('tx-send').addEventListener('click', function () {
      var ids = Object.keys(edits); if (!ids.length) return;
      var body = { edits: ids.map(function (k) { return { id: k, from: BASE[k], to: edits[k] }; }) }, btn = this;
      btn.textContent = 'Sending…';
      fetch('/api/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.ok; }, function () { return false; })
        .then(function (ok) { btn.textContent = ok ? 'Sent. Tap “Apply my text edits” in the hub' : 'Not sent: no signal? Try again'; setTimeout(count, 4000); });
    });
    refresh();
  }
  if (DEV && params.has('text')) textEditor();
  cab.classList.add('poweron'); if (gated) lock(); else show(); save();

  // offline: sw.js keeps a saved copy so the game loads at the field with no signal
  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
})();
</script>
