<title>Blank Space Baby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;600;700&display=swap">
<style>
/* The phone is the cabinet: marquee sign, CRT screen in a black bezel, push-buttons on a black control panel.
   It opens straight on category select, and the sign powers on.
   Category select: ten named keys on the panel, the boss pentagon on the screen. Each beaten category's
   pentagon flies up from its key into a slot around the boss, and five wake it.
   Play: 5 right in a row beats a category, one miss ends the run. */
:root {
  --body: #F2EDE4; --body-dark: #00843D;   /* locked palette: warm white page, Celtic Green trim */
  --bezel: #0D0F0E; --screen: #07130C; --glow: #5CF09A; --text: #EAFBF0; --dim: #7FAF92;
  --hot: #FF8A3D; --gold: #F7C948;
  --btn: #F6F0E2; --btn-edge: #CBBFA4; --btn-ink: #1E2A3B;
  --ok: #45BE76; --ok-edge: #00843D; --no: #FF5A5F; --no-edge: #B02A35;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body-font: "Pixelify Sans", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--body); color: var(--text); font-family: var(--body-font); font-weight: 600; -webkit-font-smoothing: antialiased; font-variant-ligatures: none; -webkit-user-select: none; user-select: none; }
button { -webkit-tap-highlight-color: transparent; font-variant-ligatures: none; }
.cab { max-width: 420px; height: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--body-dark) 0 6px, transparent 6px calc(100% - 6px), var(--body-dark) calc(100% - 6px)); }

/* marquee: the lit sign (flickers on when the game opens) */
.marquee { flex: none; position: relative; border-radius: 14px; padding: 14px 12px 15px; text-align: center; overflow: hidden;
  background: radial-gradient(120% 140% at 50% 0%, #1E3A2A 0%, #0B1710 70%); box-shadow: inset 0 0 0 3px #000, inset 0 0 18px rgba(92,240,154,.18), 0 3px 0 var(--body-dark); }
.marquee h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 17px; line-height: 1; letter-spacing: 1px; color: #fff; white-space: nowrap;
  text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 10px var(--glow), 0 0 20px rgba(92,240,154,.55); }
.marquee h1 .sp { position: relative; }
.marquee h1 .sp::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--glow) 0 7px, transparent 7px 11px); box-shadow: 0 0 6px var(--glow); }
.cab.poweron .marquee h1 { animation: power .6s steps(6); }
@keyframes power { 0% { opacity: 0; } 17% { opacity: 1; } 34% { opacity: .15; } 51% { opacity: 1; } 68% { opacity: .4; } 100% { opacity: 1; } }

/* screen in its bezel */
.bezel { flex: 1 1 auto; min-height: 0; max-height: 520px; border-radius: 20px; padding: 10px; background: var(--bezel); box-shadow: 0 3px 0 var(--body-dark), inset 0 0 0 2px #222; }
.screen { position: relative; height: 100%; box-sizing: border-box; border-radius: 12px; overflow: hidden; padding: 14px 16px 16px;
  background: radial-gradient(130% 110% at 50% 40%, #0D2216 0%, var(--screen) 70%); display: flex; flex-direction: column; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 40px rgba(0,0,0,.7); }
.flick { animation: flick .28s steps(4); }
@keyframes flick { 0% { filter: brightness(2.2) contrast(.6); } 50% { filter: brightness(.5); } 100% { filter: none; } }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.cab[data-v="select"] #v-select, .cab[data-v="play"] #v-play, .cab[data-v="boss"] #v-boss { display: flex; }
.px { shape-rendering: crispEdges; flex: none; display: block; fill: currentColor; }


/* the answer, filled into the blank */
.fill { color: var(--glow); text-shadow: 0 0 8px rgba(92,240,154,.7); }
.missed .fill { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.35); padding-bottom: 3px;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em) left bottom / 100% 3px no-repeat; }   /* a miss still shows the right answer, without the win glow */
/* select: the boss pentagon in the middle, and a slot around it for each earned pentagon */
#v-select { container-type: size; }
.board { position: relative; flex: none; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.board .p { position: absolute; width: 21%; transform: translate(-50%, -50%); color: #3E7A57; filter: drop-shadow(0 0 3px rgba(92,240,154,.35)); }
.pg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 54%; }   /* turn around the shape's own center */
.pg polygon { fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.pg.o polygon { fill: none; stroke-width: 6; }
.board .p.on { color: var(--text); filter: drop-shadow(0 0 5px rgba(92,240,154,.8)); }   /* a soccer ball: one color, no rainbow */
.board .p.on.pending { visibility: hidden; }
.board .p.new svg { animation: bump .45s steps(3); }   /* animate the shape, not the slot, so it stays centered */
.board .lock { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); color: #3E7A57; }
.board.awake .boss-p { color: var(--text); filter: drop-shadow(0 0 6px rgba(92,240,154,.9)) drop-shadow(0 0 14px rgba(92,240,154,.5)); }
.board.awake .boss-p svg { animation: bob 1.2s steps(2) infinite; }
.board.awake .lock { display: none; }
.flyer .pg { transition: transform .75s cubic-bezier(.3, .1, .2, 1); }
.flyer { position: fixed; z-index: 10; pointer-events: none; transition: transform .75s cubic-bezier(.3, .1, .2, 1); filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); color: var(--text); }
/* the boss lair */
#v-select, #v-boss { align-items: center; justify-content: center; gap: 22px; }
.boss { position: relative; color: #3A5546; }
.boss.awake { color: var(--no); filter: drop-shadow(0 0 8px rgba(255,90,95,.8)); animation: bob 1.2s steps(2) infinite; }
.boss .lock { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); color: var(--gold); filter: drop-shadow(0 0 5px rgba(247,201,72,.7)); }
.boss.awake .lock { display: none; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.pips i.new { animation: flick .5s steps(5) 2; }
#v-boss .boss { color: var(--no); filter: drop-shadow(0 0 10px rgba(255,90,95,.9)); animation: bob .6s steps(2) infinite; }

/* play */
.hud { display: flex; justify-content: space-between; align-items: center; flex: none; height: 24px; position: relative; z-index: 3; }
.hud .lvl { display: flex; align-items: center; gap: 10px; color: var(--glow); filter: drop-shadow(0 0 4px rgba(92,240,154,.6)); }
.pips { display: flex; gap: 5px; }
.pips i { width: 10px; height: 10px; box-shadow: inset 0 0 0 2px #2C4A39; }
.pips i.on { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.pips i.bump { animation: bump .35s steps(3); }
@keyframes bump { 50% { transform: scale(1.5); } }
.pips.big { gap: 9px; } .pips.big i { width: 18px; height: 18px; }
.home { width: 44px; height: 44px; margin: -10px -12px -10px 0; padding: 0; border: 0; background: none; color: var(--dim); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.face { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.sentence { margin: 0; font-size: 26px; line-height: 1.22; text-wrap: balance; text-shadow: 0 0 6px rgba(234,251,240,.25); }
.sentence.long { font-size: 23px; } .sentence.longer { font-size: 21px; }
.nb { white-space: nowrap; }
.num { font-family: var(--pixel); font-weight: 400; font-size: .8em; letter-spacing: -.02em; }
.blank { display: inline-block; width: 2.9em; height: 4px; margin: 0 0.05em; vertical-align: -0.16em;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em); box-shadow: 0 0 6px rgba(92,240,154,.6); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.big-icon { color: var(--glow); filter: drop-shadow(0 0 10px rgba(92,240,154,.9)); animation: bob .8s steps(2) infinite; }

/* the blinking go arrow, bottom right of the screen */
.go { position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--glow); cursor: pointer; z-index: 3;
  display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); animation: blink 1.05s steps(1) infinite; }
.go.wait { display: none; }

/* control panel */
.panel { flex: none; box-sizing: border-box; display: flex; margin-top: auto; border-radius: 18px; padding: 12px 12px 15px;
  background: linear-gradient(180deg, #1A1D1B 0%, #0D0F0E 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 0 0 2px #222, 0 3px 0 var(--body-dark); }
.pv { display: none; flex: 1; min-width: 0; }
.cab[data-v="select"] #p-select, .cab[data-v="boss"] #p-select { display: grid; }
.cab[data-v="play"] #choices, .cab[data-v="clear"] #choices { display: flex; }


.key { font: inherit; color: var(--btn-ink); border: 0; border-radius: 14px; background: var(--btn); box-shadow: 0 5px 0 var(--btn-edge), 0 7px 10px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .06s, box-shadow .06s, background-color .15s, opacity .2s; }
.key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-edge), 0 2px 4px rgba(0,0,0,.25); }
.key:disabled { cursor: default; }

#p-select { grid-template-columns: 1fr 1fr; gap: 8px; }
.cat { min-height: 42px; font-size: 16px; line-height: 1.05; text-align: left; padding: 4px 10px 4px 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; box-shadow: 0 4px 0 var(--btn-edge), 0 5px 8px rgba(0,0,0,.25); }
.cat:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge); }
.cat .patch { flex: none; width: 18px; color: var(--btn-edge); }
.cat.done .patch { color: var(--btn-ink); }   /* a black patch, like a real ball */
.cat.soon { opacity: .28; }
.cat.soon:disabled { cursor: default; }
.choices { flex-direction: column; gap: 10px; }
.choice { flex: none; min-height: 62px; font-size: 21px; text-align: left; padding: 6px 16px 6px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.choice .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.choice .w { line-height: 1.1; }
.choice .def { font-size: 15px; line-height: 1.15; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 0; opacity: 0; transition: max-height .2s, opacity .2s; }
.choice.right .def, .choice.wrong .def { max-height: 36px; opacity: .9; }
.choice .mark { width: 21px; flex: none; }
.choice.right { background: var(--ok); color: #05230F; box-shadow: 0 5px 0 var(--ok-edge), 0 0 18px rgba(69,190,118,.75); }
.choice.wrong { background: var(--no); color: #2B0508; box-shadow: 0 5px 0 var(--no-edge), 0 0 18px rgba(255,90,95,.7); animation: nope .32s ease; }
.choice.dim { opacity: .35; }
@keyframes nope { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }
.key:focus-visible, .go:focus-visible, .home:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }


@media (max-height: 700px) { .choice { min-height: 56px; } }
@media (max-width: 360px) { :root { --cap: 52px; } }
@media (max-height: 640px) { .cab { gap: 9px; padding-top: max(9px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); } .marquee { padding: 11px 10px 13px; } .marquee h1 { font-size: 15px; }
  .cat { font-size: 14px; min-height: 38px; } .choice { font-size: 19px; min-height: 50px; } .sentence { font-size: 22px; } .sentence.long { font-size: 20px; } .sentence.longer { font-size: 18px; }
  }
@media (prefers-reduced-motion: reduce) { .key, .choice .def { transition: none; } .pips i.bump, .choice.wrong, .flick, .blank, .go, .boss, .big-icon, .pips i.new, .board .p.new svg, .board.awake .boss-p svg, .cab.poweron .marquee h1 { animation: none; } .flyer { transition: none; } }
</style>
<div class="cab" id="cab" data-v="select">
  <div class="marquee"><h1>BLANK <span class="sp">SPACE</span> BABY</h1></div>
  <div class="bezel">
    <div class="screen" id="flip" aria-live="polite">
      <section class="view" id="v-select"><div class="board" id="lair"></div></section>
      <section class="view" id="v-play">
        <div class="hud"><span class="lvl" id="lvl"></span><button class="home" id="home" type="button" aria-label="Levels"></button></div>
        <section class="face"><p class="sentence" id="q"></p></section>
      </section>
      <section class="view" id="v-boss"><div class="boss" id="boss-big"></div></section>
      <button class="go wait" id="go" type="button" tabindex="-1" aria-label="Next"></button>
    </div>
  </div>
  <div class="panel">
    <div class="pv" id="p-select"></div>
    <div class="pv choices" id="choices"></div>
  </div>
</div>
<script>
(function () {
  var LEVELS = __LEVELS__, CATS = __CATS__;
  // pixel sprites, one string per row ('#' = lit pixel)
  var SPR = {
    // color sprites: K ink, W white, Y gold, O orange, R red, B blue, P purple, G green, k pink, D dark
    alpha:   ['..KKKKKKK..','..KBBBBBK..','..KBYYYBK..','..KYKYKYK..','..KYYYYYK..','..KYKKKYK..','..KBYYYBK..','..KBBBBBK..','..KBBBBBK..','..KKKWKKK..','..KKKKKKK..'],
    parents: ['KKKKKKKKKKK','KOOOOOOOOOK','KOWWWWWWWOK','KOWKKWKKWOK','KOWWWWWWWOK','KOOOOOOOOOK','KOOKKKKKOOK','KKKKKKKKKKK'],
    soccer:  ['...KKKKK...','.KKWWWWWKK.','.KWWWKWWWK.','KWWWKKKWWWK','KKWWKKKWWKK','KWKWWWWWKWK','KWWKWWWKWWK','KWWKKWKKWWK','.KWKKWKKWK.','.KKWWWWWKK.','...KKKKK...'],
    swift:   ['...BkkkP...','..BBBkPPP..','.YYB...PGG.','RYY.....GGO','RR.......OO','RR.......RR','OO.......RR','OGG.....YYR','.GGP...BYY.','..PPPkBBB..','...PkkkB...'],
    epl:     ['..KKKKKKK..','KKKYYWYYKKK','K.KYYWYYK.K','K.KYYYYYK.K','.KKYYYYYKK.','...KYYYK...','....KYK....','....KYK....','...KKKKK...','..KDDDDDK..','..KKKKKKK..'],
    boss:    ['.#........#.','.##......##.','.##########.','############','###..##..###','###..##..###','############','############','##.##..##.##','############','.##########.'],
    lock:    ['..###..','.#...#.','.#...#.','#######','###.###','###.###','#######'],
    home:    ['...#...','..###..','.#####.','#######','.##.##.','.##.##.','.##.##.'],
    next:    ['...#...','...##..','######.','#######','######.','...##..','...#...'],
    again:   ['..####.#.','.##...##.','##...###.','##.......','##.......','##.....##','.##...##.','..#####..'],
    ok:      ['......#','.....##','#...##.','##.##..','.###...','..#....'],
    no:      ['##...##','###.###','.#####.','..###..','.#####.','###.###','##...##']
  };
  var PAL = { K: '#1E2A3B', W: '#FFFFFF', Y: '#F7C948', O: '#FF8A3D', R: '#FF5A5F', B: '#4DA3FF', P: '#B46CFF', G: '#45BE76', k: '#FF8FC8', D: '#5B6470' };
  function svg(name, scale, cls, color) {
    var rows = SPR[name], paths = {}, inked = rows.join('').indexOf('K') >= 0 && rows.join('').replace(/[.#K]/g, '') !== '';
    rows.forEach(function (r, y) {
      for (var x = 0; x < r.length; x++) {
        var ch = r[x]; if (ch === '.') continue;
        var key = color ? ch : (ch === '#' || ch === 'K' || !inked ? '#' : null);
        if (!key) continue;
        var s = x; while (x + 1 < r.length && r[x + 1] === ch) x++;
        paths[key] = (paths[key] || '') + 'M' + s + ' ' + y + 'h' + (x - s + 1) + 'v1h-' + (x - s + 1) + 'z';
      }
    });
    var body = Object.keys(paths).map(function (k) { return '<path' + (k === '#' ? '' : ' fill="' + PAL[k] + '"') + ' d="' + paths[k] + '"/>'; }).join('');
    return '<svg class="px' + (cls ? ' ' + cls : '') + '" width="' + rows[0].length * scale + '" height="' + rows.length * scale + '" viewBox="0 0 ' + rows[0].length + ' ' + rows.length + '" aria-hidden="true">' + body + '</svg>';
  }
  // pentagons are drawn as true vectors: a pixel grid can't hold their 36° and 72° edges cleanly
  function pent(outline, turn) { return '<svg class="pg' + (outline ? ' o' : '') + '" viewBox="0 0 100 100" aria-hidden="true"><polygon' + (turn ? ' transform="rotate(' + turn + ' 50 54)"' : '') + ' points="50.00,8.00 93.75,39.79 77.04,91.21 22.96,91.21 6.25,39.79"/></svg>'; }
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var quote = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  var rx = function (w) { return new RegExp('(^|[^A-Za-z0-9])(' + quote(w) + ')(?![A-Za-z0-9])', 'i'); };
  // keep hyphenated words and score/season ranges on one line (outside tags only)
  var keep = function (html) { return html.replace(/(<[^>]*>)|([A-Za-z0-9’]+(?:[-–][A-Za-z0-9’]+)+)/g, function (m, tag, word) { return tag || '<span class="nb">' + word + '</span>'; }); };
  // Pixelify Sans draws 5 like an S, so digits use the arcade face (text outside tags only)
  var num = function (html) { return html.replace(/(<[^>]*>)|(\d+(?:[.,]\d+)*)/g, function (m, tag, d) { return tag || '<span class="num">' + d + '</span>'; }); };
  // the sentence with its answer swapped for a blank (or filled in), glued to its punctuation so they never split
  function sentence(it, fill) {
    var glue = new RegExp('(^|[^A-Za-z0-9])((?:&quot;|“)?)(' + quote(esc(it.w)) + ')(?![A-Za-z0-9])((?:[:,.!?…\'’”]|&quot;)*)', 'i');
    return num(keep(esc(it.ex).replace(glue, '$1<span class="nb">$2' + (fill ? '<span class="fill">$3</span>' : '<span class="blank" aria-label="blank"></span>') + '$4</span>')));
  }
  var size = function (it) { var n = it.ex.length; return 'sentence' + (n > 70 ? ' longer' : n > 52 ? ' long' : ''); };
  var shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var WIN = 5;

  LEVELS.forEach(function (L) {
    L.items = L.items.filter(function (x) { return rx(x.w).test(x.ex); });
    L.items.forEach(function (x) { x.k = x.k || 'word'; });
    var g = {}; (L.groups || []).forEach(function (grp, i) { grp.forEach(function (w) { (g[w] = g[w] || []).push(i); }); });
    L.clash = function (a, b) { return a === b || (g[a] || []).some(function (i) { return (g[b] || []).indexOf(i) >= 0; }); };
  });
  var byId = {}; LEVELS.forEach(function (L) { byId[L.id] = L; });
  var cleared = store.get('bsb-cleared', []).filter(function (id) { return byId[id]; });

  var cab = $('cab'), L, a, wins, missed, answered, lastSlots = [], fresh = null;
  function view(v) { cab.dataset.v = v; flick(); }
  function flick() { var s = $('flip'); s.classList.remove('flick'); void s.offsetWidth; s.classList.add('flick'); }
  function go(icon, label) {
    var g = $('go');
    if (!icon) { g.classList.add('wait'); g.tabIndex = -1; return; }
    g.innerHTML = svg(icon, 4); g.setAttribute('aria-label', label); g.classList.remove('wait'); g.tabIndex = 0;
  }

  // ---- level select ----
  CATS.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'key cat' + (c.soon ? ' soon' : ''); b.id = 't-' + c.id;
    if (c.soon) b.disabled = true;
    b.innerHTML = '<span>' + num(keep(esc(c.name))) + '</span><span class="patch">' + pent(true) + '</span>';
    b.addEventListener('click', function () { if (!c.soon) play(c.id); });
    $('p-select').appendChild(b);
  });
  // the board: the boss pentagon in the middle, five slots around it clockwise from the top.
  // Like seams on a real ball, every outer pentagon turns a flat side to the center, and the center points down
  // so its flat sides face back
  var slots = [0, 1, 2, 3, 4].map(function (k) { var a = (-90 + 72 * k) * Math.PI / 180; return [50 + 33 * Math.cos(a), 50 + 33 * Math.sin(a)]; });
  function board() {
    var html = '<div class="p boss-p" style="left:50%;top:50%">' + pent(cleared.length < 5, 180) + '<span class="lock">' + svg('lock', 3) + '</span></div>';
    slots.forEach(function (xy, k) {
      var id = cleared[k];
      html += '<div class="p' + (id ? ' on' : '') + (id && id === fresh ? ' pending' : '') + '" id="slot' + k + '" style="left:' + xy[0] + '%;top:' + xy[1] + '%' + '">' + pent(!id, 72 * k) + '</div>';
    });
    return html;
  }
  // a newly earned pentagon flies from its key up into its slot
  function fly(id) {
    var from = $('t-' + id).lastChild.getBoundingClientRect(), slot = $('slot' + cleared.indexOf(id)), to = slot.getBoundingClientRect();
    var f = document.createElement('div'); f.className = 'flyer'; f.innerHTML = pent(); var turn = 72 * cleared.indexOf(id);
    f.style.left = from.left + 'px'; f.style.top = from.top + 'px'; f.style.width = from.width + 'px';
    document.body.appendChild(f);
    var done = false;
    function land() { if (done) return; done = true; f.remove(); slot.classList.remove('pending'); slot.classList.add('new'); }
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      f.style.transform = 'translate(' + (to.left - from.left) + 'px,' + (to.top - from.top) + 'px) scale(' + (to.width / from.width) + ')';
      f.style.transformOrigin = '0 0'; f.firstChild.style.transform = 'rotate(' + turn + 'deg)';
    }); });
    f.addEventListener('transitionend', land); setTimeout(land, 1100);
  }

  $('boss-big').innerHTML = svg('boss', 10);
  function select() {
    var all = cleared.length >= 5;
    $('lair').innerHTML = board(); $('lair').setAttribute('aria-label', Math.min(cleared.length, 5) + ' of 5');
    CATS.forEach(function (c) { var d = cleared.indexOf(c.id) >= 0; $('t-' + c.id).classList.toggle('done', d); $('t-' + c.id).lastChild.innerHTML = pent(!d); });
    $('lair').classList.toggle('awake', all);
    go(all ? 'next' : null, 'Final boss');
    view('select');
    if (fresh && cleared.indexOf(fresh) < 5) fly(fresh);
    fresh = null;
  }

  cab.classList.add('poweron'); select();

  // ---- play ----
  function nextItem() {   // walk a saved shuffled order per level, so replays bring new cards
    var key = 'bsb-q-' + L.id, q = store.get(key, null), n = L.items.length;
    if (!q || !q.order || q.order.length !== n || q.at >= n) {
      var prev = q && q.order ? q.order[q.order.length - 1] : -1, order = shuffle(L.items.map(function (_, i) { return i; }));
      if (order[0] === prev && n > 1) { order.push(order.shift()); }
      q = { order: order, at: 0 };
    }
    var it = L.items[q.order[q.at]]; q.at++; store.set(key, q); return it;
  }
  function play(id) {
    L = byId[id]; wins = 0; lastSlots = [];
    $('lvl').innerHTML = svg(L.id, 2) + '<span class="pips" id="pips">' + new Array(WIN + 1).join('<i></i>') + '</span>';
    ask(); view('play');
  }
  function pips() { var ps = $('pips').children; for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('on', i < wins); }
  function ask() {
    a = nextItem(); answered = false; missed = false;
    var same = shuffle(L.items.filter(function (x) { return x.k === a.k && !L.clash(x.w, a.w); }));
    var any = shuffle(L.items.filter(function (x) { return x.k !== a.k && !L.clash(x.w, a.w); }));
    var picks = [a];
    same.concat(any).forEach(function (x) { if (picks.length < 3 && !picks.some(function (p) { return L.clash(p.w, x.w); })) picks.push(x); });
    pips();
    $('q').className = size(a); $('q').innerHTML = sentence(a); $('q').dataset.w = a.w;
    $('choices').innerHTML = '';
    var order = shuffle(picks), slot = order.indexOf(a);
    if (lastSlots.length === 2 && lastSlots[0] === slot && lastSlots[1] === slot) {   // never the same slot 3 times running
      var to = (slot + 1 + Math.floor(Math.random() * 2)) % 3, t = order[to]; order[to] = a; order[slot] = t; slot = to;
    }
    lastSlots = lastSlots.concat(slot).slice(-2);
    order.forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'key choice'; b.dataset.w = p.w;
      b.innerHTML = '<span class="txt"><span class="w">' + num(esc(p.w)) + '</span><span class="def">' + num(keep(esc(p.means))) + '</span></span><span class="mark" aria-hidden="true"></span>';
      b.addEventListener('click', function () { answer(p, b); });
      $('choices').appendChild(b);
    });
    go(null);
  }
  function answer(p, btn) {
    if (answered) return; answered = true;
    var ok = p === a;
    document.querySelectorAll('.choice').forEach(function (b) {
      b.disabled = true;
      if (b.dataset.w === a.w) { b.classList.add('right'); b.lastChild.innerHTML = svg('ok', 3); }
      else if (b === btn) { b.classList.add('wrong'); b.lastChild.innerHTML = svg('no', 3); }
      else b.classList.add('dim');
    });
    if (ok) {
      wins++; pips(); var pi = $('pips').children[wins - 1]; pi.classList.remove('bump'); void pi.offsetWidth; pi.classList.add('bump');
      go('next', wins >= WIN ? 'Level beaten' : 'Next');
    } else { missed = true; go('again', 'Try again'); }
    // the blank fills in with the answer: glowing on a win, plain on a miss
    $('q').classList.toggle('missed', !ok); $('q').innerHTML = sentence(a, true); flick();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // no leftover focus ring after a tap
  }
  function clear() {   // a beaten category goes straight back to the board, where its pentagon flies in
    if (cleared.indexOf(L.id) < 0) { cleared.push(L.id); store.set('bsb-cleared', cleared); fresh = L.id; }
    select();
  }


  // ---- one tap target: the screen ----
  $('home').innerHTML = svg('home', 3);
  $('home').addEventListener('click', function (e) { e.stopPropagation(); select(); });
  $('flip').addEventListener('click', function () {
    var v = cab.dataset.v;
    if (v === 'select') { if ($('lair').classList.contains('awake')) { go('next', 'Levels'); view('boss'); } }
    else if (v === 'boss') select();
    else if (v === 'play' && answered) {
      if (missed) play(L.id);
      else if (wins >= WIN) clear();
      else { ask(); flick(); }
    }
  });

  // offline: sw.js keeps a saved copy so the game loads at the field with no signal
  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
})();
</script>
