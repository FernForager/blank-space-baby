<title>Triviela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;600;700&display=swap">
<style>
/* The phone is the cabinet: marquee sign, CRT screen in a black bezel, push-buttons on a black control panel.
   The daily: everyone gets the same 18 cards a day, 6 white (easy), 6 yellow card (medium) and 6 red card (hard).
   Tap any tile. A right answer drops a pentagon chip into the ball, every 6 chips is a goal, one miss ends the day.
   Two board layouts while Morg compares them: the honeycomb (data-l="hex") and a simpler grid (data-l="grid"). */
:root {
  --body: #F2EDE4; --body-dark: #00843D;   /* locked palette: warm white page, Celtic Green trim */
  --bezel: #0D0F0E; --screen: #07130C; --glow: #5CF09A; --text: #EAFBF0; --dim: #7FAF92; --gold: #F7C948;
  --btn: #F6F0E2; --btn-edge: #CBBFA4; --btn-ink: #1E2A3B;
  --ok: #45BE76; --ok-edge: #00843D; --no: #FF5A5F; --no-edge: #B02A35;
  --c1: #FFFFFF; --c1-edge: #C9C2B4; --c2: #F7C948; --c2-edge: #B48A1C; --c3: #D52B1E; --c3-edge: #8C170F;   /* card colors: white, yellow card, red card */
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body-font: "Pixelify Sans", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--body); color: var(--text); font-family: var(--body-font); font-weight: 600; -webkit-font-smoothing: antialiased; font-variant-ligatures: none; -webkit-user-select: none; user-select: none; }
button { -webkit-tap-highlight-color: transparent; font-variant-ligatures: none; }
.cab { max-width: 420px; height: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--body-dark) 0 6px, transparent 6px calc(100% - 6px), var(--body-dark) calc(100% - 6px)); }

/* marquee: the lit sign (flickers on when the game opens) */
.marquee { flex: none; position: relative; border-radius: 14px; padding: 14px 12px 15px; text-align: center; overflow: hidden;
  background: radial-gradient(120% 140% at 50% 0%, #1E3A2A 0%, #0B1710 70%); box-shadow: inset 0 0 0 3px #000, inset 0 0 18px rgba(92,240,154,.18), 0 3px 0 var(--body-dark); }
.marquee h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 22px; line-height: 1; letter-spacing: 3px; color: #fff; white-space: nowrap;
  text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 10px var(--glow), 0 0 20px rgba(92,240,154,.55); }
.cab.poweron .marquee h1 { animation: power .6s steps(6); }
@keyframes power { 0% { opacity: 0; } 17% { opacity: 1; } 34% { opacity: .15; } 51% { opacity: 1; } 68% { opacity: .4; } 100% { opacity: 1; } }

/* screen in its bezel */
.bezel { flex: 1 1 auto; min-height: 0; max-height: 520px; border-radius: 20px; padding: 10px; background: var(--bezel); box-shadow: 0 3px 0 var(--body-dark), inset 0 0 0 2px #222; }
.screen { position: relative; height: 100%; box-sizing: border-box; border-radius: 12px; overflow: hidden; padding: 14px 16px 16px;
  background: radial-gradient(130% 110% at 50% 40%, #0D2216 0%, var(--screen) 70%); display: flex; flex-direction: column; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 40px rgba(0,0,0,.7); }
.flick { animation: flick .28s steps(4); }
@keyframes flick { 0% { filter: brightness(2.2) contrast(.6); } 50% { filter: brightness(.5); } 100% { filter: none; } }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.cab[data-v="board"] #v-board, .cab[data-v="play"] #v-play, .cab[data-v="end"] #v-end { display: flex; }
.px { shape-rendering: crispEdges; flex: none; display: block; fill: currentColor; }
.nb { white-space: nowrap; }
.num { font-family: var(--pixel); font-weight: 400; font-size: .8em; letter-spacing: -.02em; }

/* the ball: six pentagon chip slots, five around and the center last. Like seams on a real ball, every outer
   pentagon turns a flat side to the center, and the center points down so its flat sides face back */
.ball { position: relative; flex: none; aspect-ratio: 1; }
.ball .p { position: absolute; width: 21%; transform: translate(-50%, -50%); color: #3E7A57; filter: drop-shadow(0 0 3px rgba(92,240,154,.35)); }
.pg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 54%; }   /* turn around the shape's own center */
.pg polygon { fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.pg.o polygon { fill: none; stroke-width: 6; }
.ball .p.on { color: var(--text); filter: drop-shadow(0 0 5px rgba(92,240,154,.8)); }
.ball .p.pending { visibility: hidden; }
.ball .p.new svg { animation: bump .45s steps(3); }   /* animate the shape, not the slot, so it stays centered */
.ball.goal .p { color: var(--text); filter: drop-shadow(0 0 6px rgba(92,240,154,.9)) drop-shadow(0 0 14px rgba(92,240,154,.5)); }
.ball.goal { animation: bob .3s steps(2) 3; }
.flyer { position: fixed; z-index: 10; pointer-events: none; transition: transform .6s cubic-bezier(.3, .1, .2, 1); filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); color: var(--text); transform-origin: 0 0; }
.flyer .pg { transition: transform .6s cubic-bezier(.3, .1, .2, 1); }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes bump { 50% { transform: scale(1.5); } }

/* goals: three lamps, lit one by one */
.lamps { display: flex; justify-content: center; gap: 12px; }
.lamp { display: flex; align-items: center; justify-content: center; color: #2F5A41; }
.lamp.on { color: var(--text); filter: drop-shadow(0 0 6px rgba(92,240,154,.85)); }
.lamp.new { animation: bump .45s steps(3); }

/* the board: the honeycomb on the screen */
#v-board { container-type: size; align-items: center; justify-content: center; }
.hive { position: relative; z-index: 3; flex: none; width: min(100cqw, 92.376cqh); aspect-ratio: 0.92376; container-type: inline-size; }   /* flat-top hexes: widest through the middle, where a word sits */
.cell { position: absolute; width: 25%; height: 20%; box-sizing: border-box; margin: 0; padding: 0 2.25cqw; border: 0; transform: translate(-50%, -50%) scale(.95);
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font: inherit; font-size: 4.4cqw; line-height: 1.04; text-align: center; color: var(--btn-ink); cursor: pointer; }
.cell.c1 { background: var(--c1); } .cell.c2 { background: var(--c2); } .cell.c3 { background: var(--c3); color: #fff; }
.cell:active:not(:disabled) { filter: brightness(.85); }
.cell.core { background: #0E2418; cursor: default; padding: 0; }
.cell.core .ball { width: 70%; }
.cell.done, .cell.miss { background: #12291B; color: var(--glow); }
.cell.miss { color: var(--no); }
.cab[data-l="hex"] .screen { padding-left: 8px; padding-right: 8px; }
.cab[data-l="hex"][data-v="play"] .screen, .cab[data-l="hex"][data-v="end"] .screen { padding-left: 16px; padding-right: 16px; }

/* the board: the grid, as keys on the panel, with the ball on the screen */
.pitch { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8%; width: 100%; height: 100%; }
.pitch .ball { width: min(100cqw, calc(100cqh - 44px)); }

/* play */
.hud { display: flex; justify-content: space-between; align-items: center; flex: none; height: 24px; position: relative; z-index: 3; }
.hud .lvl { display: flex; align-items: center; gap: 10px; }
.chip-card { width: 13px; height: 18px; border-radius: 2px; box-shadow: 0 0 6px rgba(255,255,255,.25); }
.chip-card.c1 { background: var(--c1); } .chip-card.c2 { background: var(--c2); } .chip-card.c3 { background: var(--c3); }
.pips { display: flex; gap: 5px; }
.pips i { width: 10px; height: 10px; box-shadow: inset 0 0 0 2px #2C4A39; }
.pips i.on { background: var(--glow); box-shadow: 0 0 6px var(--glow); }
.pips i.bump { animation: bump .35s steps(3); }
.hud .lamps { gap: 6px; }
.face { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.sentence { margin: 0; font-size: 26px; line-height: 1.22; text-wrap: balance; text-shadow: 0 0 6px rgba(234,251,240,.25); }
.sentence.long { font-size: 23px; } .sentence.longer { font-size: 21px; }
.blank { display: inline-block; width: 2.9em; height: 4px; margin: 0 0.05em; vertical-align: -0.16em;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em); box-shadow: 0 0 6px rgba(92,240,154,.6); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
/* the answer, filled into the blank: glowing on a win, plain with a dashed underline on a miss */
.fill { color: var(--glow); text-shadow: 0 0 8px rgba(92,240,154,.7); }
.missed .fill { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.35); padding-bottom: 3px;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em) left bottom / 100% 3px no-repeat; }

/* the end of the day: the result, and the card that got you */
#v-end { justify-content: center; gap: 18px; }
.result { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.word { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 20px; line-height: 1.2; color: #fff; text-align: center;
  text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 12px rgba(92,240,154,.6); }
.lost { display: flex; flex-direction: column; gap: 10px; }
.lost .sentence { font-size: 22px; } .lost .sentence.long { font-size: 20px; } .lost .sentence.longer { font-size: 19px; }
.means { margin: 0; font-size: 18px; line-height: 1.2; color: #B8E6CA; font-weight: 500; }   /* the means line is the payoff, so it stays bright */
#v-end .ball { width: min(62%, 60cqh); }
#v-end { container-type: size; }

/* the blinking go arrow, bottom right of the screen */
.go { position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--glow); cursor: pointer; z-index: 3;
  display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); animation: blink 1.05s steps(1) infinite; }
.go.wait { display: none; }

/* control panel */
.panel { flex: none; box-sizing: border-box; display: flex; margin-top: auto; border-radius: 18px; padding: 12px 12px 15px;
  background: linear-gradient(180deg, #1A1D1B 0%, #0D0F0E 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 0 0 2px #222, 0 3px 0 var(--body-dark); }
.pv { display: none; flex: 1; min-width: 0; }
.cab[data-v="board"] #p-board, .cab[data-v="end"] #p-end, .cab[data-v="play"] #choices { display: flex; }
.cab[data-l="grid"][data-v="board"] #p-board { display: grid; }
.key { font: inherit; color: var(--btn-ink); border: 0; border-radius: 14px; background: var(--btn); box-shadow: 0 5px 0 var(--btn-edge), 0 7px 10px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .06s, box-shadow .06s, background-color .15s, opacity .2s; }
.key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-edge), 0 2px 4px rgba(0,0,0,.25); }
.key:disabled { cursor: default; }

/* grid tiles: white, yellow card and red card keys, one color per column */
#p-board.tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(6, auto); grid-auto-flow: column; gap: 9px 8px; padding-bottom: 4px; }
.tile { position: relative; min-height: 52px; min-width: 0; padding: 4px 6px; font-size: 17px; line-height: 1.04; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 10px; }
.tile.c1 { background: var(--c1); box-shadow: 0 4px 0 var(--c1-edge), 0 6px 8px rgba(0,0,0,.25); }
.tile.c2 { background: var(--c2); box-shadow: 0 4px 0 var(--c2-edge), 0 6px 8px rgba(0,0,0,.25); }
.tile.c3 { background: var(--c3); box-shadow: 0 4px 0 var(--c3-edge), 0 6px 8px rgba(0,0,0,.25); color: #fff; }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.tile.done, .tile.miss { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); opacity: .3; }
.tile.c3.done, .tile.c3.miss { color: #fff; }
.hk { display: block; width: 100%; overflow-wrap: normal; word-break: normal; hyphens: none; }
.cab[data-l="hex"] #p-board { justify-content: center; padding: 4px 0; }

/* answer buttons */
.choices { flex-direction: column; gap: 10px; }
.choice { flex: none; min-height: 62px; font-size: 21px; text-align: left; padding: 6px 16px 6px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.choice .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.choice .w { line-height: 1.1; }
.choice .def { font-size: 15px; line-height: 1.15; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 0; opacity: 0; transition: max-height .2s, opacity .2s; }
.choice.right .def, .choice.wrong .def { max-height: 36px; opacity: .9; }
.choice .mark { width: 21px; flex: none; }
.choice.right { background: var(--ok); color: #05230F; box-shadow: 0 5px 0 var(--ok-edge), 0 0 18px rgba(69,190,118,.75); }
.choice.wrong { background: var(--no); color: #2B0508; box-shadow: 0 5px 0 var(--no-edge), 0 0 18px rgba(255,90,95,.7); animation: nope .32s ease; }
.choice.dim { opacity: .35; }
@keyframes nope { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }

/* end of the day: one-tap share, and the countdown to tomorrow's board */
#p-end { flex-direction: column; gap: 12px; }
.share { min-height: 62px; padding: 8px 16px 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-size: 17px; line-height: 1.25; }
.share .mark { flex: none; }
.share .ball-i { display: inline-block; vertical-align: -2px; margin-right: 3px; }
.clock { font-family: var(--pixel); font-size: 15px; letter-spacing: 1px; color: var(--glow); text-align: center; text-shadow: 0 0 6px rgba(92,240,154,.6); padding: 2px 0 1px; }
.key:focus-visible, .go:focus-visible, .cell:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

@media (max-height: 700px) { .choice { min-height: 56px; } .tile { min-height: 46px; font-size: 16px; } }
@media (max-height: 640px) { .cab { gap: 9px; padding-top: max(9px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); } .marquee { padding: 11px 10px 13px; } .marquee h1 { font-size: 19px; }
  .choice { font-size: 19px; min-height: 50px; } .sentence { font-size: 22px; } .sentence.long { font-size: 20px; } .sentence.longer { font-size: 18px; }
  .tile { min-height: 44px; font-size: 15px; } #p-board.tiles { gap: 7px 7px; } .panel { padding: 10px 10px 13px; }
  .lost .sentence { font-size: 19px; } .lost .sentence.long, .lost .sentence.longer { font-size: 17px; } .means { font-size: 16px; } .word { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { .key, .choice .def { transition: none; } .pips i.bump, .choice.wrong, .flick, .blank, .go, .ball.goal, .ball .p.new svg, .lamp.new, .cab.poweron .marquee h1 { animation: none; } .flyer, .flyer .pg { transition: none; } }
</style>
<div class="cab" id="cab" data-v="board" data-l="hex">
  <div class="marquee"><h1>TRIVIELA</h1></div>
  <div class="bezel">
    <div class="screen" id="flip" aria-live="polite">
      <section class="view" id="v-board"></section>
      <section class="view" id="v-play">
        <div class="hud"><span class="lvl" id="lvl"></span><span id="hud-goals"></span></div>
        <section class="face"><p class="sentence" id="q"></p></section>
      </section>
      <section class="view" id="v-end"></section>
      <button class="go wait" id="go" type="button" tabindex="-1" aria-label="Next"></button>
    </div>
  </div>
  <div class="panel">
    <div class="pv" id="p-board"></div>
    <div class="pv choices" id="choices"></div>
    <div class="pv" id="p-end"><button class="key share" id="share" type="button"><span class="txt" id="share-txt"></span><span class="mark" id="share-mark"></span></button><div class="clock" id="clock"></div></div>
  </div>
</div>
<script>
(function () {
  var DECKS = __DECKS__, START = __START__;
  // pixel sprites, one string per row ('#' = lit pixel)
  var SPR = {
    // color sprites: K ink, W white
    ball:  ['...KKKKK...','.KKWWWWWKK.','.KWWWKWWWK.','KWWWKKKWWWK','KKWWKKKWWKK','KWKWWWWWKWK','KWWKWWWKWWK','KWWKKWKKWWK','.KWKKWKKWK.','.KKWWWWWKK.','...KKKKK...'],
    next:  ['...#...','...##..','######.','#######','######.','...##..','...#...'],
    ok:    ['......#','.....##','#...##.','##.##..','.###...','..#....'],
    no:    ['##...##','###.###','.#####.','..###..','.#####.','###.###','##...##'],
    share: ['....#....','...###...','..#####..','....#....','....#....','##..#..##','#.......#','#.......#','#.......#','#########']
  };
  var PAL = { K: '#1E2A3B', W: '#FFFFFF' };
  function svg(name, scale, cls, color) {
    var rows = SPR[name], paths = {}, inked = rows.join('').indexOf('K') >= 0 && rows.join('').replace(/[.#K]/g, '') !== '';
    rows.forEach(function (r, y) {
      for (var x = 0; x < r.length; x++) {
        var ch = r[x]; if (ch === '.') continue;
        var key = color ? ch : (ch === '#' || ch === 'K' || !inked ? '#' : null);
        if (!key) continue;
        var s = x; while (x + 1 < r.length && r[x + 1] === ch) x++;
        paths[key] = (paths[key] || '') + 'M' + s + ' ' + y + 'h' + (x - s + 1) + 'v1h-' + (x - s + 1) + 'z';
      }
    });
    var body = Object.keys(paths).map(function (k) { return '<path' + (k === '#' ? '' : ' fill="' + PAL[k] + '"') + ' d="' + paths[k] + '"/>'; }).join('');
    return '<svg class="px' + (cls ? ' ' + cls : '') + '" width="' + rows[0].length * scale + '" height="' + rows.length * scale + '" viewBox="0 0 ' + rows[0].length + ' ' + rows.length + '" aria-hidden="true">' + body + '</svg>';
  }
  // pentagons are drawn as true vectors: a pixel grid can't hold their 36° and 72° edges cleanly
  function pent(outline, turn) { return '<svg class="pg' + (outline ? ' o' : '') + '" viewBox="0 0 100 100" aria-hidden="true"><polygon' + (turn ? ' transform="rotate(' + turn + ' 50 54)"' : '') + ' points="50.00,8.00 93.75,39.79 77.04,91.21 22.96,91.21 6.25,39.79"/></svg>'; }
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var quote = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  // keep hyphenated words and score/season ranges on one line (outside tags only)
  var keep = function (html) { return html.replace(/(<[^>]*>)|([A-Za-z0-9’]+(?:[-–][A-Za-z0-9’]+)+)/g, function (m, tag, word) { return tag || '<span class="nb">' + word + '</span>'; }); };

  var num = function (html) { return html.replace(/(<[^>]*>)|(\d+)/g, function (m, tag, d) { return tag || '<span class="num">' + d + '</span>'; }); };   // commas stay in the body font, so 60,704 doesn't gap
  // the sentence with its answer swapped for a blank (or filled in), glued to its punctuation so they never split
  function sentence(it, fill) {
    var glue = new RegExp('(^|[^A-Za-z0-9])((?:&quot;|“)?)(' + quote(esc(it.w)) + ')(?![A-Za-z0-9])((?:[:,.!?…\'’”]|&quot;)*)', 'i');

  var size = function (it) { var n = it.ex.length; return 'sentence' + (n > 70 ? ' longer' : n > 52 ? ' long' : ''); };
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ---- seeded randomness: the same date gives every player the same board ----
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  function copy(text) { var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }

  // ---- one tap target: the screen ----
  $('flip').addEventListener('click', function () { if (cab.dataset.v === 'play' && answered) next(); });
  function show() {   // open the day where it was left: the end, an open card, or the board
    if (S.open >= 0 && S.res[S.open]) { S.open = -1; save(); }
    if (over()) return end();
    if (S.open >= 0) return ask();
    board(); view('board');
  }
  document.addEventListener('visibilitychange', function () {   // a finished or untouched day rolls over at midnight
    if (document.hidden || FIXED !== null || today() === S.day || !(over() || !S.path.length)) return;
    S = load(); save(); show();
  });
  cab.classList.add('poweron'); show(); save();

  // offline: sw.js keeps a saved copy so the game loads at the field with no signal
  try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
})();
</script>
