<title>Triviela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;600;700&family=Yellowtail&display=swap">
<style>
/* The phone is the cabinet: marquee sign, CRT screen in a black bezel, push-buttons on a black control panel.
   The daily, as a shootout (Morg, Oct 19, 2026): everyone gets the same 15 cards a day, 5 white (easy), 5 yellow card
   (medium) and 5 red card (hard), and plays all 15. Tap any tile. A right answer lights the next panel of the ball,
   from the middle out, and 15 right lights the center last: GOLAZO! The board is the grid: the ball on the screen,
   the 15 tiles as keys on the panel, one card color per column. */
:root {
  --body: #F2EDE4; --body-dark: #00843D;   /* locked palette: warm white page, Celtic Green trim */
  --bezel: #0D0F0E; --screen: #07130C; --glow: #5CF09A; --text: #EAFBF0; --dim: #7FAF92; --gold: #F7C948;
  --btn: #F6F0E2; --btn-edge: #CBBFA4; --btn-ink: #1E2A3B;
  --ok: #45BE76; --ok-edge: #00843D; --no: #FF5A5F; --no-edge: #B02A35;
  --c1: #FFFFFF; --c1-edge: #C9C2B4; --c2: #F7C948; --c2-edge: #B48A1C; --c3: #D52B1E; --c3-edge: #8C170F;   /* card colors: white, yellow card, red card */
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body-font: "Pixelify Sans", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }   /* the cabinet stays put: no rubber-band bounce on iPhone (Morg, Oct 17, 2026) */
body { position: fixed; inset: 0; margin: 0; }
body { background: var(--body); color: var(--text); font-family: var(--body-font); font-weight: 600; -webkit-font-smoothing: antialiased; font-variant-ligatures: none; -webkit-user-select: none; user-select: none; }
button { -webkit-tap-highlight-color: transparent; font-variant-ligatures: none; }
.cab { max-width: 420px; height: 100%; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, var(--body-dark) 0 6px, transparent 6px calc(100% - 6px), var(--body-dark) calc(100% - 6px)); }

/* marquee: the lit sign (flickers on when the game opens) */
.marquee { flex: none; position: relative; border-radius: 14px; padding: 14px 12px 15px; text-align: center; overflow: hidden;
  background: radial-gradient(120% 140% at 50% 0%, #1E3A2A 0%, #0B1710 70%); box-shadow: inset 0 0 0 3px #000, inset 0 0 18px rgba(92,240,154,.18), 0 3px 0 var(--body-dark); }
.marquee h1 { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 22px; line-height: 1; letter-spacing: 3px; color: #fff; white-space: nowrap;
  text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 10px var(--glow), 0 0 20px rgba(92,240,154,.55); }
.cab.poweron .marquee h1 { animation: power .6s steps(6); }
/* the sign as a dot-matrix board (Morg, Oct 18, 2026): every dot lit at random, the brighter ones spell TRIVIELA */
.marquee.dm { height: 66px; padding: 0; box-sizing: border-box; }
.marquee.dm canvas { position: absolute; inset: 7px 8px; width: calc(100% - 16px); height: calc(100% - 14px); }
.cab.poweron .marquee.dm canvas { animation: power .6s steps(6); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.marquee.dm .menu-b { right: 4px; z-index: 1; background: radial-gradient(closest-side, rgba(7,19,12,.95), rgba(7,19,12,.8) 70%, transparent); border-radius: 50%; }
.marquee h1.neon { font-family: 'Yellowtail', cursive; font-size: 40px; line-height: 1; letter-spacing: 0; padding: 0 30px 4px; color: #FFE6F7;
  text-shadow: 0 0 2px #fff, 0 0 7px #FF5FD2, 0 0 16px #FF2FC0, 0 0 30px rgba(255,47,192,.65), 0 0 48px rgba(255,47,192,.35); }   /* the name in pink neon (Morg, Oct 18, 2026) */
.menu-b { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.menu-b:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.menu-box { display: flex; flex-direction: column; gap: 12px; }
.menu-box .key { min-height: 50px; font-size: 17px; }
.menu-box .key[hidden] { display: none; }
.intro-box { max-width: 360px; text-align: left; padding: 20px 18px; }
.intro-box .in-q { margin: 0 0 14px; font-size: 21px; line-height: 1.2; text-align: center; color: var(--text); text-shadow: none; }
.in-list { margin: 0 0 16px; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 17px; line-height: 1.3; color: var(--text); font-weight: 500; text-align: center; white-space: nowrap; }
.in-list b { font-weight: 700; color: #fff; }
.in-colors { display: flex; gap: 14px; justify-content: center; color: var(--dim); font-size: 15px; }
.in-colors span { display: flex; align-items: center; gap: 6px; }
.tc { display: inline-block; width: 11px; height: 15px; border-radius: 2px; }
.tc.c1 { background: var(--c1); } .tc.c2 { background: var(--c2); } .tc.c3 { background: var(--c3); }
.intro-box .in-go { width: 100%; min-height: 52px; font-size: 18px; background: var(--ok); box-shadow: 0 5px 0 var(--ok-edge), 0 7px 10px rgba(0,0,0,.25); }
.marquee h1.cta { font-family: 'Yellowtail', cursive; font-size: 27px; line-height: 1.02; letter-spacing: 0; white-space: normal; padding: 0 26px 2px;
  text-shadow: 0 0 3px rgba(255,255,255,.9), 0 0 9px var(--glow), 0 0 18px rgba(92,240,154,.6), 0 0 30px rgba(92,240,154,.35); }
.ask-pop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(5,10,7,.72); }
.ask-pop[hidden] { display: none; }
.ask-box { width: 100%; max-width: 320px; box-sizing: border-box; padding: 20px 16px 18px; border-radius: 18px; background: var(--bezel); box-shadow: inset 0 0 0 3px #000, 0 0 0 3px var(--body-dark), 0 10px 30px rgba(0,0,0,.5); text-align: center; }
.ask-box p { margin: 0 0 16px; font-size: 20px; color: var(--text); text-shadow: 0 0 8px rgba(92,240,154,.5); }
.ask-keys { display: flex; gap: 10px; }
.ask-keys .key { flex: 1; min-height: 50px; font-size: 16px; }
.ask-keys .key.yes { background: var(--ok); box-shadow: 0 5px 0 var(--ok-edge), 0 7px 10px rgba(0,0,0,.25); }
.restart { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .5; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.restart:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
@keyframes power { 0% { opacity: 0; } 17% { opacity: 1; } 34% { opacity: .15; } 51% { opacity: 1; } 68% { opacity: .4; } 100% { opacity: 1; } }

/* screen in its bezel */
.bezel { flex: 1 1 auto; min-height: 0; max-height: 520px; border-radius: 20px; padding: 10px; background: var(--bezel); box-shadow: 0 3px 0 var(--body-dark), inset 0 0 0 2px #222; }
.screen { position: relative; height: 100%; box-sizing: border-box; border-radius: 12px; overflow: hidden; padding: 14px 16px 16px;
  background: radial-gradient(130% 110% at 50% 40%, #0D2216 0%, var(--screen) 70%); display: flex; flex-direction: column; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 40px rgba(0,0,0,.7); }
.flick { animation: flick .28s steps(4); }
@keyframes flick { 0% { filter: brightness(2.2) contrast(.6); } 50% { filter: brightness(.5); } 100% { filter: none; } }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.cab[data-v="board"] #v-board, .cab[data-v="play"] #v-play, .cab[data-v="end"] #v-end { display: flex; }
.px { shape-rendering: crispEdges; flex: none; display: block; fill: currentColor; }
.nb { white-space: nowrap; }
.num { font-family: var(--pixel); font-weight: 400; font-size: .8em; letter-spacing: -.02em; }

/* the ball: 15 lamp panels in three rings of five (the hexagons round the center, the outer pentagons, the half-hexagons
   at the edge) and the center pentagon, which lights only on 15/15 (Morg's lamp idea, Oct 19, 2026) */
.ball { position: relative; flex: none; aspect-ratio: 1; }
.bi { display: block; width: 100%; height: 100%; overflow: visible; }
.bi .body { fill: rgba(92,240,154,.05); }
.bi .glow { fill: url(#bglow); pointer-events: none; } .bi .shine { fill: url(#bshine); pointer-events: none; }   /* a hologram: the rim glows and a soft light sits top left */
.bi.mini .glow, .bi.mini .shine { display: none; }
.bi .sm { fill: none; stroke: #3E7A57; stroke-width: 2.2; stroke-linecap: round; }
.bi .pt { fill: url(#bdim); stroke: #3E7A57; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
.bi .pt.hx { fill: url(#bdim); fill-opacity: .45; }   /* an unlit hexagon is fainter than an unlit pentagon, so the empty ball still reads as a ball */
.bi .pt.on { fill: url(#bon); fill-opacity: 1; stroke: var(--text); filter: drop-shadow(0 0 1.5px rgba(92,240,154,.8)); }
.bi .pt.new { animation: bump .45s steps(3); }
.ball.goal .bi .sm, .ball.goal .bi .pt { stroke: var(--text); }
.ball.goal .bi { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(92,240,154,.9)); }
.ball.goal { animation: bob .3s steps(2) 3; }
.bi.mini .body { fill: currentColor; } .bi.mini .sm { stroke: var(--mp, #07130C); stroke-width: 4; } .bi.mini .pt, .bi.mini .pt.on { fill: var(--mp, #07130C); stroke: var(--mp, #07130C); stroke-width: 3; filter: none; } .bi.mini .pt.hx { fill: none; stroke: var(--mp, #07130C); stroke-width: 3; }   /* the hexagons' outlines are the seams */
.share .bi.mini, .tile .bi.mini { color: #fff; --mp: #1E2A3B; } .share .bi.mini .body, .tile .bi.mini .body { stroke: #1E2A3B; stroke-width: 7; }
.egrid .bi.mini { color: var(--text); --mp: #07130C; }   /* on the CRT: a lit ball, its patches the screen's own black */
.bi.mark { flex: none; display: block; }
.goalfx { position: absolute; left: 0; top: 0; width: 100%; height: 82%; z-index: 2; pointer-events: none; filter: drop-shadow(0 0 2px rgba(92,240,154,.55)); animation: power .5s steps(5); }
.pitch.fxon .ball { opacity: 0; }
.pitch .shout { position: absolute; inset: 0; margin: auto; height: max-content; z-index: 3; text-align: center; font-family: var(--pixel); font-size: clamp(22px, 9cqw, 34px); line-height: 1.2; color: #fff; pointer-events: none;
  text-shadow: 0 0 6px #fff, 0 0 14px var(--glow), 0 0 28px rgba(92,240,154,.7); animation: shout 2.2s ease-out forwards; }
.pitch.fxon .shout { inset: auto 0 2% 0; margin: 0 auto; opacity: 0; animation: shout 1.6s 1s ease-out forwards; }
@keyframes shout { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
.bv { display: block; overflow: visible; }
.bv polygon { fill: none; stroke: currentColor; stroke-width: 9; stroke-linejoin: round; }
.bv.on polygon { fill: currentColor; stroke-width: 4; }
.bv .rim { fill: none; stroke: currentColor; stroke-width: 4; opacity: .55; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes bump { 50% { transform: scale(1.5); } }

/* the board: the ball on the screen (the tiles are keys on the panel, below) */
#v-board { container-type: size; align-items: center; justify-content: center; }
.pitch { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.pitch .ball { width: min(100cqw, 100cqh); }   /* the ball fills the screen (Morg, Oct 17, 2026: the assembled ball is the payoff) */

/* play */
.hud { display: flex; justify-content: space-between; align-items: flex-start; flex: none; height: 27px; position: relative; z-index: 3; }
.hud .lvl { display: flex; align-items: center; gap: 10px; }
.chip-card { width: 13px; height: 18px; border-radius: 2px; box-shadow: 0 0 6px rgba(255,255,255,.25); }
.chip-card.c1 { background: var(--c1); } .chip-card.c2 { background: var(--c2); } .chip-card.c3 { background: var(--c3); }
/* the shootout scoreboard (Oct 19, 2026): three rows of five, white on top, then yellow, then red, like the share.
   A lit dot is a right answer, a pixel ✕ a miss, a dim ring a card still to play. The card in play blinks in its row */
.sb { display: grid; grid-template-columns: repeat(5, 7px); grid-auto-rows: 7px; gap: 3px 4px; }
.sb i { display: block; width: 7px; height: 7px; color: #2F6B49; }
.sb i.ok { color: var(--glow); filter: drop-shadow(0 0 3px rgba(92,240,154,.9)); }
.sb i.no { color: var(--no); }
.sb i.now { color: var(--text); animation: blink 1.05s steps(1) infinite; }
.sb i.bump { animation: bump .35s steps(3); }
.sb svg { display: block; }
.face { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.sentence { margin: 0; font-size: 26px; line-height: 1.22; text-wrap: balance; text-shadow: 0 0 6px rgba(234,251,240,.25); }
.sentence.long { font-size: 23px; } .sentence.longer { font-size: 21px; }
.blank { display: inline-block; width: 2.9em; height: 4px; margin: 0 0.05em; vertical-align: -0.16em;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em); box-shadow: 0 0 6px rgba(92,240,154,.6); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
/* the answer, filled into the blank: glowing on a win, plain with a dashed underline on a miss */
.fill { color: var(--glow); text-shadow: 0 0 8px rgba(92,240,154,.7); }
.missed .fill { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,.35); padding-bottom: 3px;
  background: repeating-linear-gradient(90deg, var(--glow) 0 0.42em, transparent 0.42em 0.62em) left bottom / 100% 3px no-repeat; }

/* the end of the day: the shootout grid and the score */
#v-end { justify-content: center; align-items: center; gap: 6cqh; }
.egrid { display: grid; grid-template-columns: auto repeat(5, auto); gap: 9px 10px; align-items: center; }
.egrid .rc { width: 9px; height: 13px; border-radius: 1.5px; margin-right: 4px; }
.egrid .rc.c1 { background: var(--c1); } .egrid .rc.c2 { background: var(--c2); } .egrid .rc.c3 { background: var(--c3); }
.egrid .em { display: flex; align-items: center; justify-content: center; }
.egrid .em.ok { filter: drop-shadow(0 0 5px rgba(92,240,154,.75)); }
.egrid .em.no { color: var(--no); }
.golazo .egrid .em.ok { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(92,240,154,.9)); }
.score { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 26px; line-height: 1; color: #fff; text-align: center; text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 12px rgba(92,240,154,.6); }
.golazo .score { font-size: 24px; text-shadow: 0 0 6px #fff, 0 0 14px var(--glow), 0 0 28px rgba(92,240,154,.7); }
.result { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.word .run { display: block; margin-top: 4px; font-size: .8em; color: var(--text); }
.word { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: 20px; line-height: 1.2; color: #fff; text-align: center;
  text-shadow: 0 0 4px rgba(255,255,255,.6), 0 0 12px rgba(92,240,154,.6); }
.means { margin: 0; font-size: 18px; line-height: 1.2; color: #B8E6CA; font-weight: 500; }   /* the means line is the payoff, so it stays bright */
#v-end .ball { width: min(62%, 60cqh); margin: 0 auto; }
#v-end { container-type: size; }

/* the blinking go arrow, bottom right of the screen */
.go { position: absolute; right: 10px; bottom: 10px; height: 44px; padding: 0 6px 0 10px; gap: 8px; font-family: var(--pixel); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; border: 0; background: none; color: var(--glow); cursor: pointer; z-index: 3;
  display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 6px rgba(92,240,154,.8)); animation: blink 1.05s steps(1) infinite; }
.go.wait { display: none; }

/* the beta only (preview links): Morg's flag and lock keys, on a card he has answered and on the card that got him
   (Oct 16, 2026). A flag is yellow like a yellow card, a lock glows green */
.beta { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 2px; z-index: 3; }
.beta[hidden], .bk[hidden] { display: none; }
.bk { flex: none; width: 40px; height: 40px; padding: 0; border: 0; background: none; color: var(--dim); opacity: .75; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.bk.on { opacity: 1; }
.bk.flag.on { color: var(--gold); filter: drop-shadow(0 0 5px rgba(247,201,72,.8)); }
.bk.lock.on { color: var(--text); filter: drop-shadow(0 0 5px rgba(92,240,154,.8)); }
.bmsg { font-family: var(--pixel); font-size: 8px; letter-spacing: 1px; color: var(--dim); margin-left: 6px; white-space: nowrap; text-transform: uppercase; }

/* control panel */
.panel { flex: none; box-sizing: border-box; display: flex; margin-top: auto; border-radius: 18px; padding: 12px 12px 15px;
  background: linear-gradient(180deg, #1A1D1B 0%, #0D0F0E 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 0 0 2px #222, 0 3px 0 var(--body-dark); }
.pv { display: none; flex: 1; min-width: 0; }
.cab[data-v="end"] #p-end, .cab[data-v="play"] #choices { display: flex; }
.cab[data-v="board"] #p-board { display: grid; }
.key { font: inherit; color: var(--btn-ink); border: 0; border-radius: 14px; background: var(--btn); box-shadow: 0 5px 0 var(--btn-edge), 0 7px 10px rgba(0,0,0,.25);
  cursor: pointer; transition: transform .06s, box-shadow .06s, background-color .15s, opacity .2s; }
.key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-edge), 0 2px 4px rgba(0,0,0,.25); }
.key:disabled { cursor: default; }

/* the tiles: easy, medium and hard, one column each */
#p-board.tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 9px 8px; padding-bottom: 4px; }
.tile { position: relative; min-height: 60px; min-width: 0; padding: 4px 6px; font-size: 17px; line-height: 1.04; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 10px; }
/* every tile is a cream key like the answer buttons. A small referee's card in the corner marks medium (yellow) and hard (red),
   and easy tiles have none (Morg, Oct 16, 2026: the bold colors took over the cabinet) */
.tile { background: var(--btn); color: var(--btn-ink); box-shadow: 0 4px 0 var(--btn-edge), 0 6px 8px rgba(0,0,0,.25); padding-left: 7px; padding-right: 7px; }   /* the shootout's taller tiles give the hook a little more width instead */
.tile.c2::after, .tile.c3::after { content: ""; position: absolute; top: 5px; right: 6px; width: 7px; height: 10px; border-radius: 1.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
.tile.c2::after { background: var(--c2); } .tile.c3::after { background: var(--c3); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.tile.done, .tile.miss { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); background: rgba(246,240,226,.34); }
/* an answered tile keeps its result: the game's pixel ball for a right answer, its pixel ✕ for a miss (shape, not just color) */
.tile.done::after, .tile.miss::after { opacity: .55; }
.tile .res { display: block; }
.tile.miss .res { color: #B02A35; }
.hk { display: block; width: 100%; overflow-wrap: normal; word-break: normal; hyphens: none; }

/* answer buttons */
.choices { flex-direction: column; gap: 10px; }
.choice { flex: none; min-height: 62px; font-size: 21px; text-align: left; padding: 6px 16px 6px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.choice .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.choice .w { line-height: 1.1; }
.choice .def { font-size: 15px; line-height: 1.15; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 0; opacity: 0; transition: max-height .2s, opacity .2s; }
.choice.right .def, .choice.wrong .def { max-height: 36px; opacity: .9; }
.choice .mark { width: 21px; flex: none; }
.choice.right { background: var(--ok); color: #05230F; box-shadow: 0 5px 0 var(--ok-edge), 0 0 18px rgba(69,190,118,.75); }
.choice.wrong { background: var(--no); color: #2B0508; box-shadow: 0 5px 0 var(--no-edge), 0 0 18px rgba(255,90,95,.7); animation: nope .32s ease; }
.choice.dim { opacity: .35; }
@keyframes nope { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }

/* end of the day: one-tap share, and the countdown to tomorrow's board */
#p-end { flex-direction: column; gap: 12px; }
.share { min-height: 62px; padding: 8px 16px 8px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-size: 17px; line-height: 1.25; }
.share .mark { flex: none; }
.share .txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; line-height: 1.12; }
